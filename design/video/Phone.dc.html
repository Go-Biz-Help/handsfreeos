<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The phone’s playbook: the short video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:transparent}
.hf{font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.hf h1,.hf h2,.hf h3,.hf p{margin:0}
.theme-light{--bg:#f9fafd;--card:#ffffff;--card-2:#f2f4f8;--border:#e4e8ee;--border-strong:#d2d6dd;--text:#191d25;--text-2:#5b616a;--text-3:#676c75;--accent-text:var(--accent);--ring:color-mix(in oklab,var(--accent) 28%,transparent);--shadow-1:0 1px 2px rgba(25,29,37,.06),0 1px 3px rgba(25,29,37,.04)}
.theme-dark{--bg:#0f131a;--card:#191d25;--card-2:#20252e;--border:#2c3139;--border-strong:#3a4049;--text:#f2f4f8;--text-2:#a0a5ae;--text-3:#8a909a;--accent-text:color-mix(in oklab,var(--accent) 62%,#ffffff);--ring:color-mix(in oklab,var(--accent) 45%,transparent);--shadow-1:0 1px 2px rgba(0,0,0,.45)}
a{color:var(--accent-text);text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;border:1px solid transparent;font:inherit;font-weight:500;font-size:15px;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.field:focus-visible,.tabbar a:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
.btn-primary{background:var(--accent);color:#fff}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}.small{font-size:13.5px}.xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.stack{display:flex;flex-direction:column}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1)}
.field{width:100%;height:44px;border:1px solid var(--border-strong);border-radius:10px;padding:0 12px;font:inherit;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13.5px;color:var(--text);background:var(--card)}
.part{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-top:1px solid var(--border)}
.part:first-child{border-top:0}
.tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--border);background:var(--card);padding:6px 4px 20px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--text-2);padding:6px 0;border-radius:8px}
.tabbar a.on{color:var(--accent-text)}
.icon{width:18px;height:18px;flex:none}
</style>
</helmet>
<div class="hf theme-{{ theme }}" style="--accent: {{ accent }}; width: 390px; height: 844px; display: flex; flex-direction: column;">
<header class="row" style="height: 56px; padding: 0 8px 0 4px; background: var(--card); border-bottom: 1px solid var(--border);">
<a href="#" aria-label="Back to the playbook" class="row" style="width: 44px; height: 44px; justify-content: center; color: var(--text);"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="font-size: 17px; font-weight: 600; flex: 1;">Your short video</h1>
<button class="btn" type="button" style="height: 40px; padding: 0 12px; color: var(--accent-text); font-weight: 600;">Save</button>
</header>

<div class="stack" style="flex: 1; overflow: auto; padding: 16px; gap: 14px;">
<p class="small muted">Someone who says yes to your first message gets it next, then your booking link.</p>

<label class="stack" style="gap: 6px;">
<span style="font-weight: 600; font-size: 14px;">The video’s link</span>
<input class="field" type="url" value="https://www.loom.com/share/5f2c81" aria-label="The video’s link">
<span class="xs faint">Loom, YouTube (unlisted) or Google Drive. Anyone with the link must be able to watch it.</span>
</label>

<div class="row" style="justify-content: space-between; padding-top: 4px;">
<span style="font-weight: 600; font-size: 14px;">The script</span>
<span class="xs muted">About 3 minutes</span>
</div>
<section class="card" aria-label="The script">
<sc-for list="{{ parts }}" as="p" hint-placeholder-count="6">
<div class="part">
<span class="xs faint">{{ p.n }} · {{ p.title }}</span>
<p class="small" style="line-height: 1.5;">{{ p.say }}</p>
<span class="xs muted">Show: {{ p.show }}</span>
</div>
</sc-for>
</section>
<p class="xs faint">Write the script on your computer, under Playbooks in HandsFreeOS.</p>
</div>

<nav class="tabbar" aria-label="Main">
<a href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>Inbox</a>
<a href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="1"></rect><rect x="14" y="3" width="7" height="11" rx="1"></rect></svg>Pipeline</a>
<a href="#"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Calendar</a>
<a class="on" href="#" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2d69d8","options":["#2d69d8","#0f766e","#7c3aed"]},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const parts = [
      ['Who it’s for, and the problem', 'If you run a roofing company with 2 or 3 crews, this is for you. Most owners say the work comes in waves.', 'You, to the camera'],
      ['What it costs them to leave it', 'Every quiet week means crews you still pay and jobs you never hear about.', 'You, to the camera'],
      ['How it works, step by step', 'We find homeowners who need a roof looked at, reach out, and book the inspection on your calendar.', 'A slide with the three steps'],
      ['Proof: a real result or two', 'Peak Roofing got 22 inspections in 60 days, with two crews.', 'A screenshot of their calendar'],
      ['Why a call helps them', 'On a quick call I’ll show you how it would work for your crews, with your numbers.', 'You, to the camera'],
      ['What to do next', 'If that sounds good, just reply and I’ll send you a few times.', 'You, smiling, to the camera']
    ];
    return {
      accent: this.props.accent ?? '#2d69d8',
      theme: this.props.theme ?? 'light',
      parts: parts.map(([title, say, show], i) => ({ n: i + 1, title, say, show }))
    };
  }
}
</script>
</body>
</html>
