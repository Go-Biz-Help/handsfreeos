<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","inbox","customers","pipeline","calendar","money","workflows","forms","reviews","knowledge","ai","settings"],"default":"ai"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'ai';
    const keys = ['home', 'inbox', 'customers', 'pipeline', 'calendar', 'money', 'workflows', 'forms', 'reviews', 'knowledge', 'ai', 'settings'];
    const bg = {};
    const fg = {};
    const fw = {};
    keys.forEach((k) => {
      const on = k === active;
      bg[k] = on ? 'var(--accent-soft)' : 'transparent';
      fg[k] = on ? 'var(--accent-text)' : 'var(--text-2)';
      fw[k] = on ? '500' : '400';
    });
    return { bg, fg, fw };
  }
}
</script>
