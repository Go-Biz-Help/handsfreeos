# Secret scanning rules on top of the gitleaks defaults (run by CI and usable locally: gitleaks git .)
title = "HandsFreeOS"

[extend]
useDefault = true

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_...)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase service-role JWT (legacy service_role key)"
# The payload of a service-role JWT contains "service_role", which base64url-encodes to c2VydmljZV9yb2xl.
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]*c2VydmljZV9yb2xl[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{10,}'''

[[rules]]
id = "postgres-superuser-url"
description = "Database URL that connects as the postgres superuser"
regex = '''postgres(ql)?://postgres:[^@\s'"]+@'''
# The env tests prove the apps refuse such a URL; those literals are the point of the test.
[rules.allowlist]
paths = ['''apps/[^/]+/test/.*\.test\.ts$''']

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret (GOCSPX-...)"
regex = '''GOCSPX-[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "twilio-auth-token-assignment"
description = "A Twilio auth token assigned in config (32 hex characters)"
regex = '''TWILIO_AUTH_TOKEN\s*[=:]\s*['"]?[0-9a-f]{32}'''

[[rules]]
id = "postmark-token-assignment"
description = "A Postmark server or account token assigned in config"
regex = '''POSTMARK_[A-Z_]*TOKEN\s*[=:]\s*['"]?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''

[[rules]]
id = "worker-encryption-key-assignment"
description = "The worker's credential-sealing key assigned in config"
regex = '''WORKER_ENCRYPTION_KEYS?(_PREVIOUS)?\s*[=:]\s*['"]?[A-Za-z0-9+/]{43}='''

[allowlist]
# Design prototypes carry made-up sample tokens; the lockfile carries integrity hashes.
paths = ['''pnpm-lock\.yaml''', '''\.gitleaks\.toml''', '''design/.*\.dc\.html$''']
# Opinly's publishable pixel key (apps/site/src/components/opinly.tsx, and an earlier opinly-pixel.tsx in this
# repository's history). Public by design: it can only send analytics events, and Opinly has it pasted into every
# page's HTML. Only this exact value is let through — the secret sk- key is a different value and is still caught.
#
# The usage rate card's keys (core's USAGE_KEYS, mirrored in SQL), like `a2p.brand.vetting`: lowercase words joined
# by dots after `key:`, which the generic rule reads as a random token. Names, never secrets, and they come back
# every time someone edits a rate-card line, so the shape is let through rather than each commit's fingerprint.
regexes = [
  '''^pk-4URAEI_KUurk_6J8t-fX_Hg2OjhEeT1fjYPs4h5$''',
  '''^(number|sms|mms|voice|ai|speech|a2p)\.[a-z0-9_]+(\.[a-z0-9_]+)*$''',
]
