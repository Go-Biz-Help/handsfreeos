name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch, and a newer push cancels the one before it — on a pull request, where the only thing
# lost is a result nobody was going to read.
#
# **Never on `main`.** The phone release (mobile-release.yml) runs `on: workflow_run` and only when the CI run it
# follows concluded `success`, so a cancelled run on main is a merge that silently never ships to phones. Merges
# arrive in bursts, each one cancelling the last, and the release that matters is the one that never happened —
# nothing fails, nothing is red, and the phones quietly fall behind `main`. Three merges went out undeployed before
# anybody noticed, back when the API and the worker waited for CI too (they now ship when Vercel's build is ready).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

# Three parts side by side, each on its own machine, and `verify` answering for all of them. They share nothing but
# the checkout, so the wait is the longest part rather than the sum. Measured on 2026-09-28 with everything in one
# job: setup, lint, typecheck and formatting about 9 minutes; the unit, database, API and worker tests about 22;
# the seed and the two builds about 3; the browser tests 28 clean and up to 37 with retries — 58 minutes, and 69 to
# 73 on slow runners against that job's 75-minute limit. Every check still runs on every pull request and every
# push to main; nothing is skipped.
#
# Each limit is there to stop a hung job burning an hour, not to hold a part to a stopwatch, so each gets room: on
# 2026-09-19 a 45-minute limit killed a green commit mid-browser-test and skipped the deploy behind it.
jobs:
  checks:
    name: Lint, typecheck, formatting and the website
    runs-on: ubuntu-latest
    # About 9 minutes. None of it needs the database.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A migration that shares a version with another is silently skipped rather than refused — on the stacks the
      # other two parts start, and on every environment after. This part fails, and `verify` with it.
      - name: Every migration has its own version
        run: node scripts/migrations-check.mjs

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      # The export builds the API in memory: no server and no database (apps/api/scripts/export-openapi.ts).
      - name: Generated API client is fresh
        run: pnpm --filter @hfos/api openapi:export && pnpm --filter @hfos/api-client check

      - name: Build the public website
        run: pnpm --filter @hfos/site build

      - name: The website build ships no Opinly secret
        # The blog reads Opinly with a secret key that can also record purchases; it must stay on the server.
        # The pixel's publishable pk- key is meant to be public and is not matched.
        run: |
          if grep -rqE "OPINLY_API_KEY|OPINLY_WEBHOOK_SIGNING_SECRET|whsec_[A-Za-z0-9+/=]{20,}|sk-[A-Za-z0-9_-]{24,}" apps/site/.next/static; then
            echo "An Opinly secret or its name is in the website's assets"; exit 1
          fi

  tests:
    name: Unit, database, API and worker tests
    runs-on: ubuntu-latest
    # About 26 minutes, and up to 9 more when a registry holds the stack's images back (below).
    timeout-minutes: 45
    # The token checks out the code and signs Docker in to ghcr.io, nothing else. Naming any permission here sets
    # every one not named to none.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Signed out, the stack's image downloads from ghcr.io share one limit with everything else on the runner's
      # network address, and on 2026-09-23 that limit refused them for over an hour. Signed in with this job's token,
      # twice as many layers got through as signed out. The images are public, so `packages: read` is all it needs.
      - name: Sign Docker in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # When a registry won't hand over an image, scripts/supabase.mjs stops and tries again a minute later, up to
      # ten times, instead of failing the job before a single test has run. On a bad day that is 9 minutes of
      # waiting, which the limit above has room for.
      - name: Start the local Supabase stack (auth, database, realtime, storage, mailpit)
        # supabase/setup-cli points the CLI at ghcr.io alone. Without it, the CLI tries each image at
        # public.ecr.aws, then ghcr.io, then Docker Hub, so one registry refusing downloads doesn't stop the stack.
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/supabase.mjs start -x imgproxy,studio,edge-runtime,logflare,vector

      - name: Write local env files
        run: pnpm env:local

      - name: Unit, database, API and worker tests
        run: pnpm test

      - name: The seed builds through the command pipeline
        run: pnpm db:seed

      - name: Stop the local stack
        if: always()
        run: node scripts/supabase.mjs stop --no-backup

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # About 35 minutes, 42 with retries, and up to 9 more when a registry holds the stack's images back. The
    # browser tests make their own people and businesses, so they need no seed.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # As in `tests`.
      - name: Sign Docker in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the local Supabase stack (auth, database, realtime, storage, mailpit)
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/supabase.mjs start -x imgproxy,studio,edge-runtime,logflare,vector

      - name: Write local env files
        run: pnpm env:local

      # The browser tests serve this production build.
      - name: Build the web app
        run: pnpm --filter @hfos/web build

      - name: The web build ships no secret key
        # Match a real key, not the bare prefix: supabase-js itself checks key formats with the literal string.
        run: |
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{20,}" apps/web/.next/static; then
            echo "A Supabase secret key is in the web assets"; exit 1
          fi
          # Provider secrets live in the worker only; their names or values must never reach the browser.
          if grep -rqE "GOCSPX-[A-Za-z0-9_-]{20,}|TWILIO_AUTH_TOKEN|POSTMARK_[A-Z_]*TOKEN|WORKER_ENCRYPTION_KEY|OAUTH_CLIENT_SECRET" apps/web/.next/static; then
            echo "A provider secret or its name is in the web assets"; exit 1
          fi

      - name: Install the Playwright browser
        run: pnpm --filter @hfos/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Stop the local stack
        if: always()
        run: node scripts/supabase.mjs stop --no-backup

  # The name the one job before this carried, so anything waiting on that check (the rules for merging) keeps
  # working: it passes only when all three parts did. `always()`, because a job whose `needs` failed would otherwise
  # be skipped, and a skipped check counts as passed.
  verify:
    name: Lint, typecheck, tests, browser tests
    needs: [checks, tests, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every part passed
        run: |
          for result in ${{ needs.checks.result }} ${{ needs.tests.result }} ${{ needs.browser.result }}; do
            if [ "$result" != success ]; then
              echo "Checks: ${{ needs.checks.result }}. Tests: ${{ needs.tests.result }}. Browser tests: ${{ needs.browser.result }}."
              exit 1
            fi
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull request the scanner asks GitHub which commits it covers, which the default token may not read.
    # Without this it crashes with a 403 before it scans anything, and the job fails as if it had found a secret.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
