name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch, and a newer push cancels the one before it — on a pull request, where the only thing
# lost is a result nobody was going to read.
#
# **Never on `main`.** The phone release (mobile-release.yml) runs `on: workflow_run` and only when the CI run it
# follows concluded `success`, so a cancelled run on main is a merge that silently never ships to phones. Merges
# arrive in bursts, each one cancelling the last, and the release that matters is the one that never happened —
# nothing fails, nothing is red, and the phones quietly fall behind `main`. Three merges went out undeployed before
# anybody noticed, back when the API and the worker waited for CI too (they now ship when Vercel's build is ready).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

# The parts run side by side, each on its own machine, and `verify` answers for all of them. They share nothing but
# the checkout, so the wait is the longest part rather than the sum. Every check still runs on every pull request
# and every push to main; nothing is skipped.
#
# The tests and the browser tests are cut into pieces, each with its own machine and its own local stack. Measured
# on 2026-10-15 with each in one job: the six test suites ran at once on that job's two cores, the worker's took 40
# minutes and core's 33, and the job ran into its 45-minute limit; the browser tests took 52 minutes on their own
# and ran into their 60-minute limit. Both cancelled green commits that had to be run again.
#
# Each limit is there to stop a hung job burning an hour, not to hold a part to a stopwatch, so each gets room: on
# 2026-09-19 a 45-minute limit killed a green commit mid-browser-test and skipped the deploy behind it.
jobs:
  checks:
    name: Lint, typecheck, formatting and the website
    runs-on: ubuntu-latest
    # About 9 minutes. None of it needs the database.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A migration that shares a version with another is silently skipped rather than refused — on the stacks the
      # other two parts start, and on every environment after. This part fails, and `verify` with it.
      - name: Every migration has its own version
        run: node scripts/migrations-check.mjs

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      # The export builds the API in memory: no server and no database (apps/api/scripts/export-openapi.ts).
      - name: Generated API client is fresh
        run: pnpm --filter @hfos/api openapi:export && pnpm --filter @hfos/api-client check

      - name: Build the public website
        run: pnpm --filter @hfos/site build

      - name: The website build ships no Opinly secret
        # The blog reads Opinly with a secret key that can also record purchases; it must stay on the server.
        # The pixel's publishable pk- key is meant to be public and is not matched.
        run: |
          if grep -rqE "OPINLY_API_KEY|OPINLY_WEBHOOK_SIGNING_SECRET|whsec_[A-Za-z0-9+/=]{20,}|sk-[A-Za-z0-9_-]{24,}" apps/site/.next/static; then
            echo "An Opinly secret or its name is in the website's assets"; exit 1
          fi

  # The worker's and core's suites are the long ones, so each is cut in two by file (Vitest's --shard). Every other
  # package's tests run together in the fifth part, which names what it leaves out rather than what it runs, so a
  # package that gains tests is tested without anyone touching this file.
  tests:
    name: Tests (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    # Each part had about 10 to 20 minutes of the old job's 40, and up to 9 more when a registry holds the stack's
    # images back (below).
    timeout-minutes: 35
    # The token checks out the code and signs Docker in to ghcr.io, nothing else. Naming any permission here sets
    # every one not named to none.
    permissions:
      contents: read
      packages: read
    strategy:
      # One part failing doesn't stop the others, so a pull request sees every failure at once.
      fail-fast: false
      matrix:
        part:
          - name: core, half 1
            run: pnpm exec turbo run test --filter=@hfos/core -- --shard=1/2
          - name: core, half 2
            run: pnpm exec turbo run test --filter=@hfos/core -- --shard=2/2
          - name: worker, half 1
            run: pnpm exec turbo run test --filter=@hfos/worker -- --shard=1/2
            ffmpeg: true
          - name: worker, half 2
            run: pnpm exec turbo run test --filter=@hfos/worker -- --shard=2/2
            ffmpeg: true
          - name: database, API, phone app, extension and the seed
            run: pnpm exec turbo run test --filter=!@hfos/core --filter=!@hfos/worker
            seed: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Signed out, the stack's image downloads from ghcr.io share one limit with everything else on the runner's
      # network address, and on 2026-09-23 that limit refused them for over an hour. Signed in with this job's token,
      # twice as many layers got through as signed out. The images are public, so `packages: read` is all it needs.
      - name: Sign Docker in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The stack's ports (54420–54429, supabase/config.toml) sit inside the range Linux picks the runner's outgoing
      # connections from (32768–60999). On 2026-10-24 something on the runner already held 54424 when the mail container
      # asked for it, twice running, and the job failed before a single test had run. A reserved port is never picked for
      # an outgoing connection, and the stack can still listen on it.
      - name: Keep the stack's ports free
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54420-54429

      # When a registry won't hand over an image, scripts/supabase.mjs stops and tries again a minute later, up to
      # ten times, instead of failing the job before a single test has run. On a bad day that is 9 minutes of
      # waiting, which the limit above has room for.
      - name: Start the local Supabase stack (auth, database, realtime, storage, mailpit)
        # supabase/setup-cli points the CLI at ghcr.io alone. Without it, the CLI tries each image at
        # public.ecr.aws, then ghcr.io, then Docker Hub, so one registry refusing downloads doesn't stop the stack.
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/supabase.mjs start -x imgproxy,studio,edge-runtime,logflare,vector

      - name: Write local env files
        run: pnpm env:local

      # The worker turns videos texted to a business into MP4s with ffmpeg (apps/worker/src/telephony/video.ts), and
      # its test converts a real one. The runner image has no ffmpeg; the worker's Docker image installs its own.
      - name: Install ffmpeg
        if: matrix.part.ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Tests (${{ matrix.part.name }})
        run: ${{ matrix.part.run }}

      - name: The seed builds through the command pipeline
        if: matrix.part.seed
        run: pnpm db:seed

      - name: Stop the local stack
        if: always()
        run: node scripts/supabase.mjs stop --no-backup

  # The spec files are shared out over four machines (Playwright's --shard), each building the web app and serving
  # it from its own stack. The browser tests make their own people and businesses, so they need no seed, and a spec
  # file never leans on another's.
  browser:
    name: Browser tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # About 7 minutes to start the stack and build, then a quarter of the old 52 minutes of tests, more with retries,
    # and up to 9 more when a registry holds the stack's images back.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # As in `tests`.
      - name: Sign Docker in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # As in `tests`.
      - name: Keep the stack's ports free
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54420-54429

      - name: Start the local Supabase stack (auth, database, realtime, storage, mailpit)
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/supabase.mjs start -x imgproxy,studio,edge-runtime,logflare,vector

      - name: Write local env files
        run: pnpm env:local

      # The video call spec's media server (docs/video-calls.md): LiveKit in its dev mode on this machine, telling the
      # worker who comes and goes the way LiveKit Cloud does in production. Its dev keys aren't secrets. No other spec
      # uses it, and the video call spec is skipped wherever the worker isn't on LiveKit.
      - name: Start a local LiveKit server
        run: |
          docker run -d --name livekit --network host livekit/livekit-server:v1.13.10 \
            --dev --bind 127.0.0.1 --node-ip 127.0.0.1 \
            --config-body "$(printf 'webhook:\n  api_key: devkey\n  urls:\n    - http://127.0.0.1:4100/webhooks/livekit\n')"
          printf '%s\n' VIDEO_PROVIDER=livekit LIVEKIT_URL=ws://127.0.0.1:7880 LIVEKIT_API_KEY=devkey \
            LIVEKIT_API_SECRET=secret >> apps/worker/.env
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:7880/ && exit 0; sleep 1; done
          docker logs livekit; exit 1

      # The browser tests serve this production build.
      - name: Build the web app
        run: pnpm --filter @hfos/web build

      - name: The web build ships no secret key
        # Match a real key, not the bare prefix: supabase-js itself checks key formats with the literal string.
        run: |
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{20,}" apps/web/.next/static; then
            echo "A Supabase secret key is in the web assets"; exit 1
          fi
          # Provider secrets live in the worker only; their names or values must never reach the browser.
          if grep -rqE "GOCSPX-[A-Za-z0-9_-]{20,}|TWILIO_AUTH_TOKEN|POSTMARK_[A-Z_]*TOKEN|WORKER_ENCRYPTION_KEY|OAUTH_CLIENT_SECRET|LIVEKIT_API_SECRET" apps/web/.next/static; then
            echo "A provider secret or its name is in the web assets"; exit 1
          fi

      - name: Install the Playwright browser
        run: pnpm --filter @hfos/web exec playwright install --with-deps chromium

      - name: Browser tests (${{ matrix.shard }} of 4)
        run: pnpm exec turbo run test:e2e -- --shard=${{ matrix.shard }}/4

      - name: LiveKit's log
        if: failure()
        run: docker logs livekit 2>&1 | tail -n 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Stop the local stack
        if: always()
        run: node scripts/supabase.mjs stop --no-backup

  # The name the one job before this carried, so anything waiting on that check (the rules for merging) keeps
  # working: it passes only when every part did, each piece of the tests and the browser tests included (a matrix's
  # result is a failure when any piece failed). `always()`, because a job whose `needs` failed would otherwise be
  # skipped, and a skipped check counts as passed.
  verify:
    name: Lint, typecheck, tests, browser tests
    needs: [checks, tests, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every part passed
        run: |
          for result in ${{ needs.checks.result }} ${{ needs.tests.result }} ${{ needs.browser.result }}; do
            if [ "$result" != success ]; then
              echo "Checks: ${{ needs.checks.result }}. Tests: ${{ needs.tests.result }}. Browser tests: ${{ needs.browser.result }}."
              exit 1
            fi
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks command itself, not gitleaks-action: the action wants a license key for an organization's
      # repository and fails without one. This scans the whole history (a few seconds) with .gitleaks.toml and
      # .gitleaksignore, and fails the job when it finds a secret.
      - name: Scan the history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
