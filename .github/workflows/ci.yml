name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Lint, typecheck, tests, browser tests
    runs-on: ubuntu-latest
    # Measured on 2026-09-19: setup, lint, typecheck and format about 7 minutes; the unit, database, API and
    # worker tests 9 to 12; the seed and the two builds about 3; the browser tests 20 to 23. That is 40 to 45
    # against a 45 minute limit, so a slow runner failed a green commit — the job was killed mid-browser-test
    # and the deploy behind it skipped. The limit is here to stop a hung job burning an hour, not to hold the
    # suite to a stopwatch, so it gets room. Better would be to run the browser tests as their own job beside
    # this one; they share nothing but the checkout.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start the local Supabase stack (auth, database, realtime, storage, mailpit)
        run: node scripts/supabase.mjs start -x imgproxy,studio,edge-runtime,logflare,vector

      - name: Write local env files
        run: pnpm env:local

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - name: Generated API client is fresh
        run: pnpm --filter @hfos/api openapi:export && pnpm --filter @hfos/api-client check

      - name: Unit, database, API and worker tests
        run: pnpm test

      - name: The seed builds through the command pipeline
        run: pnpm db:seed

      - name: Build the web app
        run: pnpm --filter @hfos/web build

      - name: The web build ships no secret key
        # Match a real key, not the bare prefix: supabase-js itself checks key formats with the literal string.
        run: |
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{20,}" apps/web/.next/static; then
            echo "A Supabase secret key is in the web assets"; exit 1
          fi
          # Provider secrets live in the worker only; their names or values must never reach the browser.
          if grep -rqE "GOCSPX-[A-Za-z0-9_-]{20,}|TWILIO_AUTH_TOKEN|POSTMARK_[A-Z_]*TOKEN|WORKER_ENCRYPTION_KEY|OAUTH_CLIENT_SECRET" apps/web/.next/static; then
            echo "A provider secret or its name is in the web assets"; exit 1
          fi

      - name: Build the public website
        run: pnpm --filter @hfos/site build

      - name: Install the Playwright browser
        run: pnpm --filter @hfos/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Stop the local stack
        if: always()
        run: node scripts/supabase.mjs stop --no-backup

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On a pull request the scanner asks GitHub which commits it covers, which the default token may not read.
    # Without this it crashes with a 403 before it scans anything, and the job fails as if it had found a secret.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
