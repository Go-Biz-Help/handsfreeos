name: Phone app on Android

# The phone app's Maestro flows (apps/mobile/maestro, tagged `ci`) on an Android emulator: signing in with a
# password and with an emailed code (read from the local stack's Mailpit), Home and the tabs, switching business,
# locking and unlocking, no signal with the access token run out (airplane mode, which only Android emulators have),
# the phone's encrypted copy of the business coming down from PowerSync and staying readable with no signal, another
# person signing in deleting the last one's copy, the queue of changes, a customer's text arriving as a notification
# whose Reply is pressed in the notification shade, links opening the app's screens, the notification switches, and a
# Real Estate deal's duty done with a photo as its proof and a tour's check-in, both with no signal (recorded).
# Its own workflow, so the 45-minute CI job keeps its room.
# A run takes about 90 minutes of Actions time, so it runs only when started by hand, about once per step:
# `gh workflow run "Phone app on Android" --repo Go-Biz-Help/handsfreeos --ref main`.
on:
  workflow_dispatch:

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  MAESTRO_VERSION: 2.10.0
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: true

# Reading the repository, and the ghcr.io login below for the stack's images.
permissions:
  contents: read
  packages: read

jobs:
  maestro-android:
    name: Maestro flows on an Android emulator
    runs-on: ubuntu-latest
    # About 25 minutes to build the app, 10 to start everything and boot the emulator, and 55 for the flows: a full
    # run took 88 minutes, and the next, with a slower build, was stopped at 90 in its last flow. This leaves room
    # for more flows and a slow runner.
    timeout-minutes: 110
    steps:
      # The runner's disk is mostly toolchains this job never uses, and the Supabase images, both NDKs, Gradle's
      # native builds and the emulator's system image don't fit beside them: one run stopped mid-build with "No space
      # left on device", and another left the emulator 25 MB short of its data partition. The unused ones go first,
      # including every preinstalled NDK but the two React Native and expo-updates build with.
      - name: Make room on the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell /opt/az /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby /usr/local/share/chromium /opt/google/chrome \
            /opt/microsoft/msedge
          for ndk in /usr/local/lib/android/sdk/ndk/*; do
            case "$(basename "$ndk")" in
              27.1.12297006 | 27.0.12077973) ;;
              *) sudo rm -rf "$ndk" ;;
            esac
          done
          df -h /

      # A private repository's runner has 2 cores and about 7 GB of memory, which the stack, the build and the
      # emulator take turns with. The memory log is printed when the job fails.
      - name: Log memory for the whole job
        run: |
          nproc
          free -m
          cat > "$RUNNER_TEMP/log-memory.sh" <<'EOF'
          while true; do
            printf '%s ' "$(date -u +%H:%M:%S)"
            free -m | awk '/Mem:/ {printf "used %s MB, available %s MB", $3, $7} /Swap:/ {printf ", swap used %s MB\n", $3}'
            sleep 30
          done
          EOF
          nohup bash "$RUNNER_TEMP/log-memory.sh" > "$RUNNER_TEMP/memory.log" 2>&1 &

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without hardware acceleration the emulator crawls for the whole time limit, so a runner without KVM fails
      # here. The runner images no longer have a udev rules folder, so the device is opened up directly.
      - name: Let the emulator use KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner has no /dev/kvm, so the emulator can't use hardware acceleration."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # The stack's images come from ghcr.io, where anonymous downloads share a much lower limit across GitHub's
      # runners (see ci.yml). Downloading as this workflow gets the higher one; a login that fails leaves the
      # download anonymous, as it was, rather than failing the job.
      - name: Log in to ghcr.io, so image downloads get the higher limit
        continue-on-error: true
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Start the local Supabase stack
        # supabase/setup-cli points the CLI at ghcr.io alone. Without it, the CLI tries each image at
        # public.ecr.aws, then ghcr.io, then Docker Hub, so one registry refusing downloads doesn't stop the stack.
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/supabase.mjs start -x imgproxy,studio,edge-runtime,logflare,vector

      # The emulator reaches this machine's Supabase, API and PowerSync through `adb reverse`, as localhost. The
      # publishable key is the local stack's, and public.
      - name: Point the app at the local stack
        working-directory: apps/mobile
        run: |
          KEY=$(node ../../scripts/supabase.mjs status -o env | sed -n 's/^PUBLISHABLE_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
          test -n "$KEY"
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=http://localhost:54421"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$KEY"
            echo "EXPO_PUBLIC_API_URL=http://localhost:4000"
            echo "EXPO_PUBLIC_WEB_URL=http://localhost:3000"
            echo "EXPO_PUBLIC_SYNC_URL=http://localhost:54430"
            echo "EXPO_PUBLIC_WORKER_URL=http://localhost:4100"
          } > .env.local

      # The build needs the memory: a run with the stack beside it stopped halfway, with no error, and hung until the
      # job's time ran out. The stack keeps its data and starts again after the build.
      - name: Stop the stack while the app builds
        run: node scripts/supabase.mjs stop

      # A release build carries its JavaScript, so no Metro. EXPO_PUBLIC_E2E=1 swaps Face ID for a test prompt,
      # shows the test switches, and lets the build use plain http to the emulator's host (app.config.ts). The build
      # must say op-sqlite is using SQLCipher: with the switch in the wrong package.json it quietly isn't (spike 1a).
      #
      # Gradle writes to a file rather than a pipe: a helper process it leaves behind can hold a pipe open, and the
      # step then never ends. Lint's release checks are for store builds and are skipped here, and the Gradle and
      # Kotlin daemons get fixed heaps and are stopped afterwards, so the emulator has the memory back.
      - name: Build the test app (release, x86_64)
        working-directory: apps/mobile
        timeout-minutes: 50
        env:
          EXPO_PUBLIC_E2E: '1'
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          cat > "$RUNNER_TEMP/skip-lint-vital.gradle" <<'EOF'
          allprojects {
            tasks.configureEach { if (name.startsWith('lintVital')) enabled = false }
          }
          EOF
          set +e
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --init-script "$RUNNER_TEMP/skip-lint-vital.gradle" \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Pkotlin.daemon.jvmargs=-Xmx1536m > ../gradle.log 2>&1
          code=$?
          set -e
          ./gradlew --stop > /dev/null 2>&1 || true
          pkill -f KotlinCompileDaemon || true
          tail -n 80 ../gradle.log
          if [ "$code" -ne 0 ]; then
            tail -n 40 "$RUNNER_TEMP/memory.log"
            sudo dmesg | grep -i -E "out of memory|killed process" || true
            exit "$code"
          fi
          bash ../scripts/check-sqlcipher.sh android ../gradle.log

      # React Native builds with NDK 27.1 and expo-updates asks for 27.0 (spike 1a), and Gradle downloads whichever
      # the runner lacks. Once the app is built, only its APK is needed: the native build folders go, so the
      # emulator's system image and data partition fit.
      - name: Keep the APK, and clear the build folders
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          rm -rf apps/mobile/android
          find node_modules/.pnpm -type d \( -path '*/android/build' -o -path '*/android/.cxx' \) -prune -exec rm -rf {} +
          df -h /

      - name: Start the local Supabase stack again
        # supabase/setup-cli points the CLI at ghcr.io alone. Without it, the CLI tries each image at
        # public.ecr.aws, then ghcr.io, then Docker Hub, so one registry refusing downloads doesn't stop the stack.
        run: env -u SUPABASE_INTERNAL_IMAGE_REGISTRY node scripts/supabase.mjs start -x imgproxy,studio,edge-runtime,logflare,vector

      - name: Write local env files
        run: pnpm env:local

      - name: Seed the demo businesses
        run: pnpm db:seed

      - name: Start the API
        run: |
          pnpm --filter @hfos/api exec tsx src/server.ts > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1

      # The worker with its stand-ins: the fake carrier files a customer's text, and the push stand-in (PUSH_PROVIDER's
      # default outside production) keeps the pushes it was handed, which the app's Test notifications reads back
      # from its test routes and shows. A short poll, as Playwright's worker has, so a push is queued within a second.
      # The Assistant answers from the scripted stand-in model (M10 step 17), as the browser suite does: no API key,
      # and the same answers every run.
      - name: Start the worker
        run: |
          ASSISTANT_PROVIDER=scripted WORKER_POLL_MS=500 pnpm --filter @hfos/worker exec tsx src/main.ts > worker.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4100/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat worker.log
          exit 1

      # PowerSync beside the stack, as the Sync service workflow starts it: its own storage Postgres, and the step
      # ends once its first copy of the database is done. Its two images take a few GB of the runner's disk. It starts
      # only after the stack is back up: a stack stopped under it would break its replication.
      - name: Start PowerSync
        run: pnpm sync:start

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Android 14's automated-test-device image (fewer system apps and services, made for CI), not the full Android 16
      # image the local runs use: on this runner's two cores, with the stack and the API beside it, the full image's
      # System UI stopped responding over the app and its low-memory killer ran.
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_atd
          # Automated-test-device images come from the canary channel.
          channel: canary
          profile: pixel_6
          ram-size: 3072M
          # The default data partition is over 7 GB; the app, its copy of a business and Maestro need far less.
          disk-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          # The system keeps starting for a while after it reports booted: let it settle, and close any "isn't
          # responding" dialog it left over the screen, before the first flow. A test build can't prove it may open
          # https://app.handsfreeos.com links (a store build does, with its signing fingerprint), so Android is told
          # it may, for the links flow.
          script: |
            sleep 45
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb reverse tcp:54421 tcp:54421
            adb reverse tcp:4000 tcp:4000
            adb reverse tcp:4100 tcp:4100
            adb reverse tcp:54430 tcp:54430
            adb install -r "$RUNNER_TEMP/app-release.apk"
            adb shell pm set-app-links --package com.gobizhelp.handsfreeos 2 app.handsfreeos.com
            maestro test apps/mobile/maestro --include-tags ci --format junit --output maestro-report.xml --test-output-dir maestro-artifacts

      - name: PowerSync's log
        if: failure()
        run: docker logs --tail 400 hfos-sync > sync.log 2>&1 || true

      - name: Memory while it ran
        if: failure()
        run: cp "$RUNNER_TEMP/memory.log" memory.log && tail -n 60 memory.log

      # Maestro names each flow's folder after the flow, and GitHub refuses artifact paths with characters like "?"
      # ("…asks Still send?"), so its output goes up as one archive. Kept on a passing run too: a flow's recording
      # (Real Estate's offline flow records itself) is how a run that passed is seen.
      - name: Pack Maestro's output
        if: always()
        run: if [ -d maestro-artifacts ]; then tar -czf maestro-artifacts.tar.gz maestro-artifacts; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-android
          path: |
            maestro-report.xml
            maestro-artifacts.tar.gz
            api.log
            worker.log
            memory.log
            sync.log
            apps/mobile/gradle.log
          retention-days: 7

      - name: Stop PowerSync and drop its replication slot
        if: always()
        run: pnpm sync:stop

      - name: Stop the local stack
        if: always()
        run: node scripts/supabase.mjs stop --no-backup
