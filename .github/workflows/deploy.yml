name: Deploy

# Ship the API and the worker to Fly.io as soon as Vercel has built the web app for a push to main, then the sync
# service. Until the FLY_API_TOKEN repository secret exists this workflow only notes that it skipped; the sync service
# likewise waits until its own Fly app has its secrets.
#
# The web app is not deployed here: Vercel builds it from the same push and, when the build is ready, tells GitHub
# (a `repository_dispatch` event). This workflow deploys that same commit's worker and API, then reports back to
# Vercel, whose Deployment Check holds app.handsfreeos.com until the report says the API is up ("Make Vercel wait for
# the API" in docs/operations.md). The web app and the API it calls go live together, a few minutes after a merge,
# rather than the web app at once and the API forty-five minutes later behind CI. CI still runs on every pull request
# and on main; it no longer holds the deploy back.
#
# That is why the sync service is a second job rather than three more steps in the first: the web app should wait
# for the API it calls, and never for PowerSync copying a database for a quarter of an hour.
on:
  # Vercel sends these for every deployment of every project it builds from this repository, previews included; the
  # deploy job answers only the web app's production builds. `skipped` and `ignored` are production builds Vercel
  # chose not to make (nothing in the web app changed), and the API and the worker still ship for those.
  repository_dispatch:
    types: [vercel.deployment.ready, vercel.deployment.skipped, vercel.deployment.ignored]
  # A hand run ships the newest commit on main. It doesn't report to Vercel, so a web build still waiting on its check
  # needs its own run re-run, or Force Promote in Vercel.
  workflow_dispatch:

jobs:
  deploy:
    name: The API and the worker on Fly.io
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.client_payload.environment == 'production' &&
      github.event.client_payload.project.name == 'handsfreeos-web')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, with at most one waiting. Every preview build starts a run of this workflow too, and one of
    # those (whose jobs all skip) must never take a real deploy's waiting slot, so only a real deploy joins the group.
    concurrency:
      group: >-
        ${{ (github.event_name == 'workflow_dispatch' || (github.event.client_payload.environment == 'production' &&
        github.event.client_payload.project.name == 'handsfreeos-web')) && 'deploy-production' ||
        format('deploy-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
      # The report to Vercel is a commit status; the action reads this run's jobs to know whether they passed.
      statuses: write
      actions: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The commit Vercel built, not whatever main points at by now.
      SHA: ${{ github.event.client_payload.git.sha || github.sha }}
    steps:
      # First, so it reports last: it marks the check pending now and, once every step below has run, passed or
      # failed. The name is what the Deployment Check in the Vercel project waits for; change both together. A report
      # that can't be sent never stops the deploy: the web app then waits for Force Promote, which is visible and safe.
      - name: Tell Vercel when the API is up
        if: github.event_name == 'repository_dispatch'
        continue-on-error: true
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - handsfreeos-web: api'

      - name: Is Fly.io set up?
        id: check
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # A production build of a commit that isn't on main (`vercel deploy --prod` from a branch, or anyone who can write
      # to the repository sending this event by hand) doesn't ship the API: only a merged commit does.
      - name: Is the commit on main?
        if: github.event_name == 'repository_dispatch' && steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            echo "::error::$SHA is not on main ($status), so it was not deployed."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: steps.check.outputs.ready == 'true'

      # Both images build from the repository root (they copy the shared packages); Fly's builders do the work.
      - name: Deploy the worker (webhooks first, so providers never hit a half-deployed pair)
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy . --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile --remote-only --wait-timeout 300

      - name: Deploy the API
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --remote-only --wait-timeout 300

  # Its own job so the web app never waits on it. The sync service (apps/sync) ships only once handsfreeos-sync
  # exists with its three secrets ("Sync service: PowerSync on Fly" in docs/operations.md), and only when its config
  # changed since the running one: a deploy makes every phone reconnect, and a changed sync-config.yaml makes
  # PowerSync copy the whole database again.
  sync:
    name: The sync service on Fly.io
    needs: deploy
    if: needs.deploy.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # A changed sync config can take up to 15 minutes to finish copying.
    timeout-minutes: 60
    # Its own queue, so a slow copy never holds up the next API deploy, and two never deploy the service at once.
    concurrency:
      group: ${{ needs.deploy.outputs.ready == 'true' && 'deploy-sync' || format('deploy-sync-skipped-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@1.6

      - name: Is the sync service set up, and did its config change?
        id: sync
        run: |
          set -euo pipefail
          if ! secrets=$(flyctl secrets list --app handsfreeos-sync --json 2>/dev/null); then
            echo "::notice::handsfreeos-sync doesn't exist on Fly yet, so the sync service wasn't deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=$(node -e '
            const have = new Set(JSON.parse(process.argv[1] || "[]").map((s) => s.name ?? s.Name));
            console.log(["PS_DATA_SOURCE_URI", "PS_STORAGE_URI", "PS_ADMIN_TOKEN"].filter((n) => !have.has(n)).join(" "));
          ' "$secrets")
          if [ -n "$missing" ]; then
            echo "::notice::handsfreeos-sync has no $missing yet, so the sync service wasn't deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wanted=$(cat apps/sync/fly.toml apps/sync/service.yaml apps/sync/sync-config.yaml apps/sync/scripts/status.mjs | sha256sum | cut -c1-16)
          running=$(flyctl machine list --app handsfreeos-sync --json | node -e '
            const machines = JSON.parse(require("fs").readFileSync(0, "utf8") || "[]");
            const service = machines.find((m) => m.config?.metadata?.fly_process_group === "app");
            console.log(service?.config?.env?.HFOS_SYNC_CONFIG ?? "");
          ')
          if [ "$wanted" = "$running" ]; then
            echo "::notice::The sync service's config hasn't changed, so it wasn't redeployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "config=$wanted" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the sync service (one machine, never stopped)
        if: steps.sync.outputs.deploy == 'true'
        run: flyctl deploy . --config apps/sync/fly.toml --ha=false --wait-timeout 600 --env HFOS_SYNC_CONFIG=${{ steps.sync.outputs.config }}

      # A new sync config copies the whole database before it serves phones; one that doesn't finish holds WAL in the
      # hosted database, so the run fails and GitHub emails you ("A deploy that doesn't finish" in the guide).
      - name: Wait for a new sync config to finish copying
        if: steps.sync.outputs.deploy == 'true'
        run: flyctl ssh console --app handsfreeos-sync -g app -C "node /config/status.mjs --wait 900"

      - name: Keep the daily compaction machine in step
        if: steps.sync.outputs.deploy == 'true'
        run: node apps/sync/scripts/compaction-machine.mjs
