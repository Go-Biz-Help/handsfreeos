name: Phone app release

# The phone app's half of "a commit on main goes live by itself". CI decides whether the commit is sound; this job
# then asks EAS to run apps/mobile/.eas/workflows/deploy-production.yml on that exact commit, which either builds and submits to
# TestFlight and Play or sends an over-the-air update, depending on whether the native side changed. What it decides
# and why is written at the top of that file.
#
# Same shape as deploy.yml, and for the same reason: nothing reaches a store from a commit CI has not passed. It is a
# separate workflow rather than a third job in deploy.yml because the phone app waits for no server — the API deploy
# and a twenty-minute app build have nothing to say to each other.
#
# Until the EXPO_TOKEN repository secret exists this only notes that it skipped, so main stays green before Expo's
# robot user is set up.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild:
        type: boolean
        default: false
        description: >-
          Build and submit both phones even if a build for this fingerprint exists on EAS: for a build that never
          reached TestFlight or Play.

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    name: Build or update the phone app
    # `branches: [main]` above matches the head branch's name only, and a pull request from a fork whose branch is
    # called main passes CI too. Only a push to main in this repository may reach the stores.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # A production build for both phones, plus both submissions, runs about forty minutes on a busy queue.
    timeout-minutes: 60
    permissions:
      contents: read
      # To read how the last release ended.
      actions: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # app.json → expo.extra.eas.projectId. EAS identifies the project by this and nothing else.
      EAS_PROJECT_ID: 22b0e923-de8b-4b67-9089-2c4bd440a956
      # The commit CI just verified, not whatever main points at now.
      GIT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Set this repository variable to `true` once Play Console has an app record for com.gobizhelp.handsfreeos and
      # EAS holds a Google service-account key. Until then the .aab is built and waits in EAS for an upload by hand.
      SUBMIT_ANDROID: ${{ vars.MOBILE_SUBMIT_ANDROID == 'true' }}
    steps:
      - name: Is Expo set up?
        id: check
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set, so the phone app was not built or updated."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # EAS decides between a build and an update by asking whether a build with this fingerprint exists, and a build
      # can exist without ever reaching a phone: a run that built and then failed (its submission, or anything after)
      # leaves it on EAS, and every run after takes it as shipped and sends updates to it. TestFlight build 9 got none
      # of them for a day that way (23–24 September), and kept closing on a bug fixed the night before. So when the
      # last release didn't finish, this one builds and submits again. A release that outlived the wait below counts
      # as finished; if EAS failed it later, run this workflow by hand with `rebuild`.
      - name: Did the last release finish?
        id: last
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.rebuild == true }}
        run: |
          set -euo pipefail
          if [ "$ASKED" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "Rebuilding: asked for by hand."
            exit 0
          fi
          # Newest first. A release that never asked EAS for anything (skipped, cancelled while it waited its turn, no
          # EXPO_TOKEN yet) says nothing about what reached the phones, so the newest one that did ask decides. The
          # step it looks for is the one below, by name.
          # GitHub not answering is no reason to hold a release back: it goes as an ordinary one.
          unsure() {
            echo "::warning::Couldn't read how the last release ended, so this is an ordinary release. If it didn't finish, run this workflow by hand with rebuild."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mobile-release.yml/runs?branch=main&status=completed&per_page=30" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") || unsure
          for id in $runs; do
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '[.jobs[] | select(any(.steps[]?; .name == "Ask EAS to ship this commit" and .conclusion == "success"))][0] // empty | "\(.conclusion) \(.html_url)"') || unsure
            [ -n "$job" ] || continue
            conclusion=${job%% *}
            if [ "$conclusion" = "success" ]; then
              echo "rebuild=false" >> "$GITHUB_OUTPUT"
              echo "The last release finished: ${job#* }"
            else
              echo "rebuild=true" >> "$GITHUB_OUTPUT"
              echo "::notice::The last release asked EAS to ship and then ended as $conclusion (${job#* }), so this one builds and submits again."
            fi
            exit 0
          done
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          echo "No earlier release asked EAS for anything."

      - name: Ask EAS to ship this commit
        id: dispatch
        if: steps.check.outputs.ready == 'true'
        env:
          REBUILD: ${{ steps.last.outputs.rebuild }}
        run: |
          set -euo pipefail
          body=$(jq -nc \
            --arg appId "$EAS_PROJECT_ID" \
            --arg gitRef "$GIT_REF" \
            --argjson submitAndroid "$SUBMIT_ANDROID" \
            --argjson rebuild "$REBUILD" \
            '{appId: $appId, gitRef: $gitRef, fileName: "deploy-production.yml", inputs: {submit_android: $submitAndroid, rebuild: $rebuild}}')
          response=$(curl -fsS -X POST "https://api.expo.dev/v2/workflows/dispatch" \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body")
          id=$(echo "$response" | jq -r '.data.id // empty')
          url=$(echo "$response" | jq -r '.data.url // empty')
          if [ -z "$id" ]; then
            echo "::error::EAS accepted the request but named no run: $response"
            exit 1
          fi
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice::$url"
          echo "[The run on EAS]($url)" >> "$GITHUB_STEP_SUMMARY"

      # EAS emails on a failed run too, but a red job here is what puts the failure next to the commit that caused
      # it. A run that outlives the wait is not failed — it is still going, on EAS, and the link above follows it.
      - name: Wait for it
        if: steps.check.outputs.ready == 'true'
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 45 * 60 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # A blip talking to EAS is not a failed release: say so and ask again in thirty seconds.
            if ! run=$(curl -fsS "https://api.expo.dev/v2/workflows/runs/$RUN_ID" \
              -H "Authorization: Bearer $EXPO_TOKEN"); then
              echo "couldn't reach EAS, trying again"
              sleep 30
              continue
            fi
            status=$(echo "$run" | jq -r '.data.status')
            case "$status" in
              success)
                echo "EAS finished: the phone app was built, submitted or updated."
                exit 0
                ;;
              failure|canceled)
                echo "::error::The EAS run ended as $status. Open the run linked above to see which job stopped it."
                exit 1
                ;;
              action-required)
                echo "::warning::The EAS run is waiting for someone to approve a job."
                ;;
              *)
                echo "still $status"
                ;;
            esac
            sleep 30
          done
          echo "::notice::Still running after 45 minutes. The run carries on at EAS; this job is not waiting for it."

      # The production builds ask the `production` channel for updates, and deploy-production.yml publishes them to
      # the `production` branch. The channel is what points at the branch, and nothing here ever set that: on 25
      # September it pointed at no branch at all, so every phone asking for an update was told "There are no branches
      # linked to the channel" and kept the JavaScript its build came with. This puts the link back on every release,
      # so an unlinked channel lasts one release at most.
      #
      # It runs whether or not the EAS run succeeded: a failed build is no reason to leave the updates that did go
      # out unreachable. `continue-on-error`, because this step failing must show without failing the release: the
      # step above reads a failed release as one that didn't finish, and would rebuild and resubmit both phones for it.
      - name: Point the production channel at the production branch
        if: ${{ !cancelled() && steps.check.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          CHANNEL: production
          BRANCH: production
        run: |
          set -euo pipefail
          gql() {
            local out
            # Said on stderr: stdout is the answer, and callers keep it.
            out=$(curl -fsS https://api.expo.dev/graphql \
              -H "Authorization: Bearer $EXPO_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$1" --argjson v "$2" '{query: $q, variables: $v}')") ||
              { echo "::error::Couldn't reach Expo's API." >&2; exit 1; }
            if [ "$(echo "$out" | jq '.errors // [] | length')" != "0" ]; then
              echo "::error::Expo's API refused the request: $(echo "$out" | jq -c '.errors')" >&2
              exit 1
            fi
            echo "$out"
          }
          found=$(gql 'query ($appId: String!, $channel: String!, $branch: String!) {
              app { byId(appId: $appId) {
                updateChannelByName(name: $channel) { id branchMapping isPaused }
                updateBranchByName(name: $branch) { id } } } }' \
            "$(jq -nc --arg appId "$EAS_PROJECT_ID" --arg channel "$CHANNEL" --arg branch "$BRANCH" \
              '{appId: $appId, channel: $channel, branch: $branch}')")
          branch_id=$(echo "$found" | jq -r '.data.app.byId.updateBranchByName.id // empty')
          channel_id=$(echo "$found" | jq -r '.data.app.byId.updateChannelByName.id // empty')
          mapping=$(echo "$found" | jq -r '.data.app.byId.updateChannelByName.branchMapping // empty')
          if [ -z "$branch_id" ]; then
            echo "::notice::No $BRANCH branch yet: nothing has been published to it, so there is nothing to point at."
            exit 0
          fi
          # How `eas channel:edit --branch` writes it: every request, whatever its runtime or platform, reads the branch.
          want=$(jq -nc --arg id "$branch_id" '{version: 0, data: [{branchId: $id, branchMappingLogic: "true"}]}')
          if [ -z "$channel_id" ]; then
            gql 'mutation ($appId: ID!, $name: String!, $mapping: String!) {
                updateChannel { createUpdateChannelForApp(appId: $appId, name: $name, branchMapping: $mapping) { id } } }' \
              "$(jq -nc --arg appId "$EAS_PROJECT_ID" --arg name "$CHANNEL" --arg mapping "$want" \
                '{appId: $appId, name: $name, mapping: $mapping}')" > /dev/null
            echo "::warning::There was no $CHANNEL channel, so this made one that reads the $BRANCH branch."
          elif [ "$(echo "$mapping" | jq -Sc '.data' 2>/dev/null)" = "$(echo "$want" | jq -Sc '.data')" ]; then
            echo "The $CHANNEL channel already reads the $BRANCH branch."
          else
            gql 'mutation ($channelId: ID!, $mapping: String!) {
                updateChannel { editUpdateChannel(channelId: $channelId, branchMapping: $mapping) { id } } }' \
              "$(jq -nc --arg channelId "$channel_id" --arg mapping "$want" '{channelId: $channelId, mapping: $mapping}')" > /dev/null
            echo "::warning::The $CHANNEL channel didn't read the $BRANCH branch (it had $mapping), so phones got no updates. It does now."
          fi
          # A pause is somebody's decision to stop updates reaching phones, so it is said out loud and left alone.
          if [ "$(echo "$found" | jq -r '.data.app.byId.updateChannelByName.isPaused // false')" = "true" ]; then
            echo "::warning::The $CHANNEL channel is paused, so phones still get no updates until someone resumes it on expo.dev."
          fi
