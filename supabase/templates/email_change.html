<h2 style="font-family: system-ui, sans-serif; color: #191d25;">Confirm your new email</h2>
<p style="font-family: system-ui, sans-serif; color: #5b616a;">Confirm that you want to change your HandsFreeOS sign-in email to <strong>{{ .NewEmail }}</strong>.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change" style="display: inline-block; background: #2d69d8; color: #ffffff; text-decoration: none; padding: 12px 18px; border-radius: 8px; font-family: system-ui, sans-serif; font-weight: 600;">Confirm new email</a></p>
<p style="font-family: system-ui, sans-serif; color: #777c86; font-size: 13px;">If you did not request this change, sign in and review your account settings.</p>
