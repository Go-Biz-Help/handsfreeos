<h2 style="font-family: system-ui, sans-serif; color: #191d25;">Reset your password</h2>
<p style="font-family: system-ui, sans-serif; color: #5b616a;">Someone asked to reset the password for <strong>{{ .Email }}</strong>. If that was you, use the link below. It works once and expires in one hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display: inline-block; background: #2d69d8; color: #ffffff; text-decoration: none; padding: 12px 18px; border-radius: 8px; font-family: system-ui, sans-serif; font-weight: 600;">Choose a new password</a></p>
<p style="font-family: system-ui, sans-serif; color: #777c86; font-size: 13px;">If you did not ask for this, ignore this email. Your password stays the same.</p>
