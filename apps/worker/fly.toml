# HandsFreeOS worker on Fly.io: the outbox, webhook and job loops plus the HTTP server providers call.
# Deployed from the repository root by .github/workflows/deploy.yml:
#   flyctl deploy . --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile --remote-only
#
# Secrets never go in this file: docs/operations.md (Fly Part 6) sets them with `fly secrets import`.
# In production the worker refuses to start without DATABASE_URL_WORKER, SMTP_URL (smtp://…:587?requireTLS=true;
# Postmark has no port 465), WORKER_ENCRYPTION_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, POSTMARK_SERVER_TOKEN,
# POSTMARK_ACCOUNT_TOKEN and POSTMARK_WEBHOOK_PASSWORD (24+ characters). SUPABASE_SECRET_KEY (files),
# TWILIO_PRIMARY_PROFILE_SID (local numbers), the Microsoft and Google OAuth client values (mailboxes; Outlook
# calendars reuse the Microsoft ones), GOOGLE_CALENDAR_OAUTH_CLIENT_ID and GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET
# (Google Calendar, its own Google Cloud project), ANTHROPIC_API_KEY (the Assistant), OPENAI_API_KEY (the backup
# AI when Claude is down) and EXPO_ACCESS_TOKEN (push notifications to phones) turn features on.
# CALENDAR_REFRESH_MS (default 600000) sets how often connected calendars' busy times are read.
# TURNSTILE_SECRET_KEY turns on Cloudflare Turnstile for the public booking page (its site key goes on Vercel as
# NEXT_PUBLIC_TURNSTILE_SITE_KEY). The worker refuses to start without it unless ALLOW_NO_BOT_CHECK=1, when
# bookings, forms and chats rely on rate limits, the honeypot and database caps.
# VERCEL_TOKEN, VERCEL_PROJECT_ID and (on a team account) VERCEL_TEAM_ID turn on branded domains — a business's
# own web address on the pages its customers see. Without them SITE_HOST is `off` and the feature is simply not
# offered, which is deliberate: see docs/operations.md, "A business's own web address".
# Save WORKER_ENCRYPTION_KEY in the password manager before setting it: without it sealed tokens can't be opened.

app = "handsfreeos-worker"
primary_region = "iad"
kill_signal = "SIGTERM"
# The worker closes its listener, then finishes the pass it is in.
kill_timeout = "30s"

# Two kinds of machine from the one image and the same secrets:
# - `app`, the worker: the HTTP server providers call, and the outbox, webhook and job loops.
# - `media`, the AI's listener for HandsFreeOS video calls (src/media.ts, docs/video-calls.md). It joins each call
#   unseen and sends what people say to Deepgram. One machine; it takes no HTTP requests. Its first deploy makes
#   the machine (`fly deploy` starts one for each new group). Off for a while: `fly scale count media=0`.
[processes]
  app = "node dist/main.js"
  media = "node dist/media.js"

[env]
  NODE_ENV = "production"
  WORKER_HTTP_PORT = "4100"
  WORKER_HTTP_HOST = "0.0.0.0"
  # The https address Twilio (and later Postmark and the mailbox providers) call; signatures are checked
  # against it, never against the Host header.
  WORKER_PUBLIC_URL = "https://hooks.handsfreeos.com"
  WEB_URL = "https://app.handsfreeos.com"
  WEB_ORIGINS = "https://app.handsfreeos.com"
  SUPABASE_URL = "https://ybupfghakoszfcxhyrby.supabase.co"
  MAIL_FROM = "HandsFreeOS <alerts@handsfreeos.com>"
  # Who is emailed each time the AI switches to OpenAI and back (comma-separated). See docs/operations.md,
  # "The backup AI: OpenAI".
  AI_ALERT_EMAILS = "chris@gobizhelp.com"
  TELEPHONY_PROVIDER = "twilio"
  # How far the usage wallet has got (M16): `off` records nothing, `shadow` prices and records every text,
  # call and AI request and never warns or stops anything, `on` warns and enforces for the businesses whose
  # own stage says so. Deliberately here rather than in `fly secrets` — it is not a secret, and keeping it in
  # the file means the current mode is visible in git and every change of it is a commit somebody reviewed.
  # See docs/operations.md, "Usage balances: what businesses pay us".
  #
  # `shadow` from 2026-10-03 to 2026-10-18: the shadow week (operations, Part 1). The ledger filled, the
  # nightly reconciliation trued it up against Twilio, and not one business heard a word. No key on
  # /admin/rates came in under 1.2× realised margin, on very little traffic.
  #
  # `on` from 2026-10-18, Chris's call. Top-ups charge cards now: a balance under its floor tops itself up
  # from its card, and Top up now charges at once. What a business sees and feels is still its own stage,
  # which is `off` for everybody until somebody moves it from /admin, one at a time. A Stripe platform key
  # must be on this app before the first business moves to `warn`, or it is told to add a card and has
  # nowhere to add one.
  WALLET_MODE = "on"
  LOG_LEVEL = "info"

[http_service]
  processes = ["app"]
  internal_port = 4100
  force_https = true
  # Webhooks must never reach a sleeping machine, and the loops must keep running between requests.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "512mb"

# Sound from each call, decoded and sent on: one shared CPU hears a few calls at once (video-calls/listener.ts).
[[vm]]
  processes = ["media"]
  size = "shared-cpu-1x"
  memory = "512mb"
