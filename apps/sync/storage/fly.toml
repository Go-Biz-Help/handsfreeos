# PowerSync's own Postgres on Fly.io (handsfreeos-sync-storage): the sync service's working data, its buckets of
# operations. It never holds a record of the business: if it is lost, the sync service copies everything again from
# Supabase, so it needs no backups (spike 1b: kept in the Supabase database, every full copy wrote about 7 times the
# data in WAL and lost the replication slot). Created once, by hand (docs/operations.md, "Sync service: PowerSync
# on Fly"):
#   fly volumes create pg_data --app handsfreeos-sync-storage --region dfw --size 3 --yes
#   fly deploy . --config apps/sync/storage/fly.toml --ha=false
#
# Postgres 17 pinned by digest (the one `pnpm sync:start` runs). No public address and no service: handsfreeos-sync
# reaches it over Fly's private network at handsfreeos-sync-storage.internal:5432. Its one secret,
# POSTGRES_PASSWORD, is set with `fly secrets import` before the first deploy and is read only when the volume is
# empty; changing it later means ALTER ROLE (the guide says how).

app = "handsfreeos-sync-storage"
primary_region = "dfw"
# Postgres's fast shutdown.
kill_signal = "SIGINT"
kill_timeout = "60s"

[build]
  image = "postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929"

[env]
  POSTGRES_USER = "powersync"
  POSTGRES_DB = "powersync"
  # A folder inside the volume: Postgres won't start in the volume's own root, which holds lost+found.
  PGDATA = "/var/lib/postgresql/data/pgdata"

[mounts]
  source = "pg_data"
  destination = "/var/lib/postgresql/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
