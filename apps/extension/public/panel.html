<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HandsFreeOS Social</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="top">
      <img src="icons/icon-32.png" width="24" height="24" alt="" />
      <div class="brand">
        <h1>HandsFree<span class="os">OS</span> <span class="product">Social</span></h1>
        <p id="where" class="where" hidden></p>
      </div>
      <span id="state" class="state" hidden></span>
    </header>

    <main>
      <div id="account" class="account"></div>
      <section id="now" class="card now" hidden></section>
      <section id="waiting" class="card waiting" hidden></section>
      <section id="done" class="card done" hidden></section>
    </main>

    <footer>
      <p id="settings-line" class="settings-line" hidden></p>
      <p id="who" class="who" hidden></p>
      <p><a id="open-hfos" target="_blank" rel="noreferrer" hidden>Open HandsFreeOS</a></p>
      <details>
        <summary>Something look wrong on this page? Tell us</summary>
        <p>
          Copy or save the outline of the Facebook page beside this panel and send it to us. It
          keeps the page’s layout and Facebook’s own words, and hides names, messages and posts.
          Look it over before you send it.
        </p>
        <div class="actions">
          <button id="copy-outline" type="button">Copy page outline</button>
          <button id="save-outline" type="button">Save page outline</button>
        </div>
        <p id="outline-said" class="status" role="status"></p>
      </details>
    </footer>

    <script src="panel.js"></script>
  </body>
</html>
