<!doctype html>
<!--
  An approximation of LinkedIn's Get a copy of your data once the archive it made is ready, as it draws it in 2026,
  written by hand: not a saved LinkedIn page, and nobody real. Above the two choices it says the archive is ready, with
  Download archive; Request archive stays at the foot for a new one.
-->
<html lang="en">
  <head>
    <title>Download your data | Settings | LinkedIn</title>
  </head>
  <body>
    <header class="_g7k2">
      <nav aria-label="Primary Navigation">
        <a href="https://www.linkedin.com/feed/"><span>Home</span></a>
        <button type="button" aria-expanded="false">
          <img alt="Chris Gee" src="me.jpg" /><span>Me</span>
        </button>
      </nav>
    </header>
    <main class="_m4p">
      <h1>Get a copy of your data</h1>
      <section class="_rd" aria-labelledby="ready-h">
        <h2 id="ready-h">Your LinkedIn data archive is ready!</h2>
        <p>
          Your archive of the files you picked was made on Oct 15, 2026. It’s available till Oct 29.
        </p>
        <button type="button" id="download" class="_b1">Download archive</button>
      </section>
      <div role="radiogroup" aria-label="Choose what to download" class="_rg">
        <div class="_ro">
          <input type="radio" name="archive" id="arc-all" value="all" />
          <label for="arc-all"
            >Download larger data archive, including connections, verifications, contacts, account
            history, and information we infer about you based on your profile and activity.</label
          >
        </div>
        <div class="_ro">
          <input type="radio" name="archive" id="arc-some" value="some" checked />
          <label for="arc-some"
            >Want something in particular? Select the data files you’re most interested in.</label
          >
        </div>
      </div>
      <button type="button" id="request" class="_b1">Request archive</button>
    </main>
  </body>
</html>
