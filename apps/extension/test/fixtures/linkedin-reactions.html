<!doctype html>
<!--
  An approximation of the box LinkedIn opens over a post when you press its reactions count, as it draws it in 2026,
  written by hand: not a saved LinkedIn page, and nobody real. A dialog with a tab for each kind of reaction, and a row
  for each person who reacted: their picture, their name, how you're connected, and their headline; you among them.
  Dismiss closes it.
-->
<html lang="en">
  <head>
    <title>Feed | LinkedIn</title>
  </head>
  <body>
    <div class="_mo0" id="modal-outlet">
      <div role="dialog" aria-labelledby="reactions-title" class="_dl1">
        <div class="_dh">
          <h2 id="reactions-title">Reactions</h2>
          <button type="button" aria-label="Dismiss"><svg aria-hidden="true"></svg></button>
        </div>
        <div role="tablist">
          <button type="button" role="tab" aria-selected="true"><span>All 3</span></button>
          <button type="button" role="tab" aria-selected="false"><span>Like 2</span></button>
          <button type="button" role="tab" aria-selected="false"><span>Insightful 1</span></button>
        </div>
        <ul class="_rl">
          <li>
            <a href="https://www.linkedin.com/in/sam-lee-77"
              ><img alt="View Sam Lee’s profile" src="s.jpg" /><span aria-hidden="true"
                >Sam Lee</span
              ><span class="_vh0">View Sam Lee’s profile</span></a
            >
            <span aria-hidden="true">· 1st</span>
            <div>Owner at Lee Heating &amp; Air</div>
          </li>
          <li>
            <a href="https://www.linkedin.com/in/riley-park-9"
              ><img alt="View Riley Park’s profile" src="r.jpg" /><span aria-hidden="true"
                >Riley Park</span
              ><span class="_vh0">View Riley Park’s profile</span></a
            >
            <span aria-hidden="true">· 2nd</span>
            <div>Property manager, Austin</div>
          </li>
          <li>
            <a href="https://www.linkedin.com/in/chris-gee-12"
              ><img alt="View Chris Gee’s profile" src="me.jpg" /><span aria-hidden="true"
                >Chris Gee</span
              ><span class="_vh0">View Chris Gee’s profile</span></a
            >
            <div>Owner, Gee Plumbing</div>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
