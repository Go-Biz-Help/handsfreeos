<!doctype html>
<!-- An approximation of a private group's page with its join questions open, written by hand: not a saved Facebook page. -->
<html lang="en">
  <body>
    <div role="banner">
      <a href="/chris.gobiz" aria-label="Your profile"><svg aria-label="Your profile"></svg></a>
    </div>
    <div role="main">
      <div>
        <h1><a href="/groups/texascontractors/">Texas Contractors Network</a></h1>
        <div><span>Private group</span><span> · </span><span>5.4K members</span></div>
        <div role="button" aria-label="Join group" id="join"><span>Join group</span></div>
      </div>
    </div>
    <div role="dialog" aria-label="Answer questions" id="questions" hidden>
      <h2>Answer questions</h2>
      <div dir="auto">The admins need a little information before you join.</div>
      <div>
        <span dir="auto">What trade are you in?</span>
        <textarea aria-label="Write an answer..." id="a1"></textarea>
      </div>
      <div>
        <span dir="auto">Where in Texas do you work?</span>
        <textarea aria-label="Write an answer..." id="a2"></textarea>
      </div>
      <div>
        <div role="checkbox" aria-checked="false" id="agree" tabindex="0"></div>
        <span>I agree to the group rules</span>
      </div>
      <div role="button" aria-label="Cancel"><span>Cancel</span></div>
      <div role="button" aria-label="Submit" id="submit"><span>Submit</span></div>
    </div>
  </body>
</html>
