<!doctype html>
<!--
  An approximation of Facebook's Birthdays page (/events/birthdays/) as it draws it in 2026, written by hand: not a saved
  Facebook page, and nobody real. Today's birthdays come first, each with a box to write on their profile; then the
  recent and upcoming ones, under parts of their own.
-->
<html lang="en">
  <body>
    <div role="banner">
      <a href="/morgan.lane.72" aria-label="Your profile"><svg aria-label="Your profile"></svg></a>
    </div>
    <div role="main">
      <div>
        <h1><span>Birthdays</span></h1>
      </div>
      <div>
        <h2><span>Today's birthdays</span></h2>
        <div>
          <div>
            <a href="https://www.facebook.com/dana.reyes.72" role="link">
              <svg aria-label="Dana Reyes" role="img"></svg>
            </a>
            <div>
              <a href="https://www.facebook.com/dana.reyes.72" role="link"
                ><span>Dana Reyes</span></a
              >
              <span>Turns 41</span>
            </div>
            <div role="textbox" aria-label="Write on Dana's profile…" contenteditable="true"></div>
          </div>
          <div>
            <a href="https://www.facebook.com/profile.php?id=100004444444444" role="link">
              <svg aria-label="Casey Moreno" role="img"></svg>
            </a>
            <div>
              <a href="https://www.facebook.com/profile.php?id=100004444444444" role="link"
                ><span>Casey Moreno</span></a
              >
            </div>
            <div role="textbox" aria-label="Write on Casey's profile…" contenteditable="true"></div>
          </div>
        </div>
      </div>
      <div>
        <h2><span>Recent birthdays</span></h2>
        <div>
          <a href="https://www.facebook.com/riley.s.72" role="link"><span>Riley Stone</span></a>
          <span>Monday, October 26</span>
        </div>
      </div>
      <div>
        <h2><span>Upcoming birthdays</span></h2>
        <div>
          <a href="https://www.facebook.com/jo.n.72" role="link"><span>Jo Nash</span></a>
          <span>Friday, October 30</span>
        </div>
      </div>
    </div>
  </body>
</html>
