<!doctype html>
<!--
  An approximation of the new conversation Message on someone's profile opens in LinkedIn's newer messaging
  (/messaging/thread/new/?recipient=…), as drawn in its interop frame in the owner's sends of 30 Oct 2026: written by
  hand from the outline's shape, not a saved LinkedIn page, and nobody real. The list of conversations is on the left;
  the new conversation has a card with their picture and name, each a link to their profile by the name in its address,
  over a form with the box to write in and, at its foot, Send (off till something's written).
-->
<html lang="en">
  <head>
    <title>(1) Messaging | LinkedIn</title>
  </head>
  <body>
    <div>
      <main>
        <div>
          <h2>Messaging</h2>
          <ul>
            <li>

            </li>
            <li>
              <a href="/messaging/thread/2-MadeUpThreadGroup0003==/"
                ><span>Tess, Ana and Lou</span></a
              >
            </li>
          </ul>
        </div>
        <div>
          <div>
            <div>
              <h2>New message</h2>
            </div>
            <div>
              <div>
                <div>
                  <a href="/in/dana-reyes-4b2a1c/">
                    <div type="circle">
                      <div>
                        <img alt="Dana Reyes" src="dana.jpg" />
                        <span>Status is reachable</span>
                      </div>
                    </div>
                  </a>
                  <div>
                    <div>
                      <a href="/in/dana-reyes-4b2a1c/"><span>Dana Reyes</span></a>
