<!doctype html>
<!--
  An approximation of LinkedIn's Get a copy of your data (/mypreferences/d/download-my-data, in Settings under Data
  privacy) as it draws it in 2026, written by hand: not a saved LinkedIn page, and nobody real. Two choices: the larger
  archive, picked to start, or the data files picked one by one, whose boxes are turned off till that choice is picked
  (the test stands in for LinkedIn turning them on). Each box is named by a label of its own, but Invitations, whose
  label is only the words in its row. Request archive at the foot; the time it takes is said beside it.
-->
<html lang="en">
  <head>
    <title>Download your data | Settings | LinkedIn</title>
  </head>
  <body>
    <header class="_g7k2">
      <nav aria-label="Primary Navigation">
        <a href="https://www.linkedin.com/feed/"><span>Home</span></a>
        <button type="button" aria-expanded="false">
          <img alt="Chris Gee" src="me.jpg" /><span>Me</span>
        </button>
      </nav>
    </header>
    <aside class="_s1">
      <h2>Settings</h2>
      <a href="https://www.linkedin.com/mypreferences/d/categories/account"
        ><span>Account preferences</span></a
      >
      <a href="https://www.linkedin.com/mypreferences/d/categories/privacy"
        ><span>Data privacy</span></a
      >
    </aside>
    <main class="_m4p">
      <h1>Get a copy of your data</h1>
      <p>See your options for accessing a copy of your account data, connections, and more</p>
      <div role="radiogroup" aria-labelledby="pick-h" class="_rg">
        <h2 id="pick-h" class="_vh">Choose what to download</h2>
        <div class="_ro">
          <input type="radio" name="archive" id="arc-all" value="all" checked />
          <label for="arc-all"
            >Download larger data archive, including connections, verifications, contacts, account
            history, and information we infer about you based on your profile and activity.
            <a href="https://www.linkedin.com/help/linkedin/answer/50191">Learn more</a></label
          >
        </div>
        <div class="_ro">
          <input type="radio" name="archive" id="arc-some" value="some" />
          <label for="arc-some"
            >Want something in particular? Select the data files you’re most interested in.</label
          >
        </div>
      </div>
      <ul class="_fl" id="files">
        <li>
          <input type="checkbox" id="f-articles" disabled /><label for="f-articles">Articles</label>
        </li>
        <li>
          <input type="checkbox" id="f-connections" disabled /><label for="f-connections"
            >Connections</label
          >
        </li>
        <li>
          <input type="checkbox" id="f-contacts" disabled /><label for="f-contacts"
            >Imported Contacts</label
          >
        </li>
        <li>
          <input type="checkbox" id="f-messages" disabled /><label for="f-messages">Messages</label>
        </li>
        <li><input type="checkbox" id="f-invitations" disabled /><span>Invitations</span></li>
        <li>
          <input type="checkbox" id="f-profile" disabled /><label for="f-profile">Profile</label>
        </li>
        <li>
          <input type="checkbox" id="f-recommendations" disabled /><label for="f-recommendations"
            >Recommendations</label
          >
        </li>
        <li>
          <input type="checkbox" id="f-rich" disabled /><label for="f-rich">Rich Media</label>
        </li>
      </ul>
      <p>
        The larger archive is ready within 24 hours; the files you pick, often within 10 minutes.
      </p>
      <button type="button" id="request" class="_b1">Request archive</button>
    </main>
  </body>
</html>
