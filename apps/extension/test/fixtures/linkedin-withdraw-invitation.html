<!doctype html>
<!--
  An approximation of the box LinkedIn opens over Sent invitations when you press Withdraw on one, asking to be sure,
  as it draws it in 2026, written by hand: not a saved LinkedIn page, and nobody real. It says what withdrawing means,
  and has Cancel and its own Withdraw.
-->
<html lang="en">
  <head>
    <title>Manage invitations | LinkedIn</title>
  </head>
  <body>
    <div class="_mo0" id="modal-outlet">
      <div role="alertdialog" aria-labelledby="withdraw-title" aria-describedby="withdraw-says">
        <div class="_dh">
          <h2 id="withdraw-title">Withdraw invitation</h2>
          <button type="button" aria-label="Dismiss"><svg aria-hidden="true"></svg></button>
        </div>
        <p id="withdraw-says">
          If you withdraw now, you won’t be able to resend to Morgan Ellis for up to 3 weeks.
        </p>
        <div class="_ft">
          <button type="button" class="_c1"><span>Cancel</span></button>
          <button type="button" class="_c2"><span>Withdraw</span></button>
        </div>
      </div>
    </div>
  </body>
</html>
