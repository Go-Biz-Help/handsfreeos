<!doctype html>
<!--
  An approximation of LinkedIn's Catch up (/mynetwork/catch-up/all/) as it draws it in 2026, written by hand: not a
  saved LinkedIn page, and nobody real. Each card links to the connection twice (their picture and their name), says
  what their news is, and has a button to answer it.
-->
<html lang="en">
  <head>
    <title>Catch up | LinkedIn</title>
  </head>
  <body>
    <header class="_g7k2">
      <nav aria-label="Primary Navigation">
        <a href="https://www.linkedin.com/mynetwork/"><span>My Network</span></a>
        <a href="https://www.linkedin.com/in/morgan-lane-72/"
          ><img alt="Morgan Lane" src="me.jpg" /><span>Me</span></a
        >
      </nav>
    </header>
    <main class="_q2w8">
      <section>
        <h1>Catch up</h1>
        <div class="_tabs">
          <button type="button" aria-pressed="true">All</button>
          <button type="button" aria-pressed="false">Birthdays</button>
          <button type="button" aria-pressed="false">Job changes</button>
        </div>
        <ul>
          <li>
            <div>
              <a href="https://www.linkedin.com/in/avery-brooks-72/"
                ><img alt="Avery Brooks" src="a.jpg"
              /></a>
              <div>
                <a href="https://www.linkedin.com/in/avery-brooks-72/"><span>Avery Brooks</span></a>
                <p>Started a new position as Owner at Brooks Roofing</p>
                <p>2d</p>
              </div>
              <button type="button"><span>Message</span></button>
            </div>
          </li>
          <li>
            <div>
              <a href="https://www.linkedin.com/in/quinn-harper-72/"
                ><img alt="Quinn Harper" src="q.jpg"
              /></a>
              <div>
                <a href="https://www.linkedin.com/in/quinn-harper-72/"><span>Quinn Harper</span></a>
                <p>Celebrating a birthday today</p>
              </div>
              <button type="button"><span>Say happy birthday</span></button>
            </div>
          </li>
          <li>
            <div>
              <a href="https://www.linkedin.com/in/lee-park-72/"
                ><img alt="Lee Park" src="l.jpg"
              /></a>
              <div>
                <a href="https://www.linkedin.com/in/lee-park-72/"><span>Lee Park</span></a>
                <p>Celebrating 5 years at Park Heating</p>
              </div>
              <button type="button"><span>Say congrats</span></button>
            </div>
          </li>
          <li>
            <div>
              <a href="https://www.linkedin.com/in/sam-ortiz-72/"
                ><img alt="Sam Ortiz" src="s.jpg"
              /></a>
              <div>
                <a href="https://www.linkedin.com/in/sam-ortiz-72/"><span>Sam Ortiz</span></a>
                <p>Starting a new role</p>
                <p>Operations Manager at Ortiz Electric</p>
              </div>
              <button type="button"><span>Message</span></button>
            </div>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
