<!doctype html>
<!--
  An approximation of the box LinkedIn opens over the page after Connect, in 2026, written by hand: not a saved
  LinkedIn page, and nobody real. It asks whether to add a note, names who the invitation is for, and sends it with
  "Send without a note". LinkedIn puts it at the end of the page; the tests move it into the page Connect was pressed
  on, as LinkedIn does.
-->
<html lang="en">
  <head>
    <title>LinkedIn</title>
  </head>
  <body>
    <div class="_ov" role="dialog" aria-labelledby="send-invite-modal" aria-modal="true">
      <div class="_mh">
        <h2 id="send-invite-modal" class="_mt">Add a note to your invitation?</h2>
        <button type="button" aria-label="Dismiss" class="_x">
          <svg aria-hidden="true"></svg>
        </button>
      </div>
      <div class="_mc">
        <p>
          Personalize your invitation to Dana Reyes by adding a note. LinkedIn members are more
          likely to accept invitations that include a note.
        </p>
      </div>
      <div class="_ma">
        <button type="button" aria-label="Add a note" class="_b2"><span>Add a note</span></button>
        <button type="button" aria-label="Send without a note" class="_b1">
          <span>Send without a note</span>
        </button>
      </div>
    </div>
  </body>
</html>
