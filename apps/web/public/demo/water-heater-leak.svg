<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <!-- The demo player's made-up customer photo: a water heater in a garage, dripping from its relief valve pipe. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b3a6"/>
      <stop offset="1" stop-color="#9c968a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8780"/>
      <stop offset="1" stop-color="#6e6b65"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9adb1"/>
      <stop offset="0.35" stop-color="#eef0f1"/>
      <stop offset="0.6" stop-color="#d9dcde"/>
      <stop offset="1" stop-color="#8f9397"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a4b23"/>
      <stop offset="0.5" stop-color="#d08a52"/>
      <stop offset="1" stop-color="#7a4020"/>
    </linearGradient>
    <radialGradient id="puddle" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5d6a72" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#58646b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#56616a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx="0.45" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#fff8e6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="560" fill="url(#wall)"/>
  <rect y="560" width="600" height="240" fill="url(#floor)"/>
  <!-- the floor's expansion joint -->
  <path d="M0 650 L600 628" stroke="#5f5c57" stroke-width="3" opacity="0.6"/>
  <!-- cold and hot lines -->
  <rect x="226" y="0" width="16" height="140" fill="url(#copper)"/>
  <rect x="352" y="0" width="16" height="140" fill="url(#copper)"/>
  <rect x="220" y="96" width="28" height="16" rx="3" fill="#c33"/>
  <!-- the tank -->
  <ellipse cx="300" cy="150" rx="150" ry="26" fill="#c9ccce"/>
  <rect x="150" y="150" width="300" height="480" fill="url(#tank)"/>
  <ellipse cx="300" cy="630" rx="150" ry="24" fill="#7d8185"/>
  <rect x="150" y="150" width="300" height="10" fill="#b7babd"/>
  <!-- label and burner door -->
  <rect x="236" y="250" width="128" height="88" rx="6" fill="#f7f7f4" stroke="#c4c6c7"/>
  <rect x="250" y="266" width="100" height="10" rx="2" fill="#2a59a8"/>
  <rect x="250" y="286" width="80" height="6" rx="2" fill="#9aa0a6"/>
  <rect x="250" y="300" width="90" height="6" rx="2" fill="#9aa0a6"/>
  <rect x="250" y="314" width="60" height="6" rx="2" fill="#9aa0a6"/>
  <rect x="262" y="520" width="76" height="56" rx="6" fill="#6f7377"/>
  <circle cx="300" cy="476" r="16" fill="#3c3f42"/>
  <rect x="294" y="452" width="12" height="20" rx="2" fill="#c33"/>
  <!-- relief valve and its pipe down the side -->
  <rect x="438" y="196" width="34" height="22" rx="4" fill="#b78a3c"/>
  <rect x="462" y="190" width="14" height="34" rx="3" fill="#8c6a2c"/>
  <rect x="470" y="214" width="14" height="380" fill="url(#copper)"/>
  <!-- drips and the puddle -->
  <path d="M477 600 q4 10 0 14 q-4 -4 0 -14z" fill="#9fb4c1"/>
  <path d="M477 628 q5 12 0 17 q-5 -5 0 -17z" fill="#a8bccb"/>
  <ellipse cx="420" cy="700" rx="190" ry="44" fill="url(#puddle)"/>
  <ellipse cx="360" cy="690" rx="70" ry="12" fill="#cfd8dd" opacity="0.25"/>
  <path d="M180 712 q60 -18 120 -4" stroke="#d9e2e7" stroke-width="3" fill="none" opacity="0.3"/>
  <!-- a phone photo's light falloff -->
  <rect width="600" height="800" fill="url(#light)"/>
</svg>
