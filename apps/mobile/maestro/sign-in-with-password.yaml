appId: com.gobizhelp.handsfreeos
name: Sign in with a password
tags:
  - ci
# Seed accounts (apps/worker/scripts/seed.ts); the password is the seed's, for local stacks only.
env:
  EMAIL: dale@lonestarhvac.test
  PASSWORD: HandsFree-Demo-2026
---
- runFlow: subflows/start-signed-out.yaml
# Email first, with no Google or Apple button and no Create an account.
- assertVisible: 'Welcome back'
- assertVisible: 'Sign in to your workspaces.'
- assertVisible:
    id: 'email-me-a-code'
- assertNotVisible: 'Continue with Google'
- assertNotVisible: 'Create an account'
# A wrong password is refused in plain words.
- tapOn:
    id: 'email'
- inputText: dale@lonestarhvac.test
- tapOn:
    id: 'use-my-password'
- tapOn:
    id: 'password'
- inputText: not-the-password
- tapOn:
    id: 'sign-in-button'
- extendedWaitUntil:
    visible: 'That email and password do not match. Try again, or email yourself a code.'
    timeout: 15000
- tapOn:
    id: 'back'
- runFlow: subflows/sign-in-with-password.yaml
- assertVisible:
    id: 'home-business'
