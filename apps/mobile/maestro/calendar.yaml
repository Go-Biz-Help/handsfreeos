appId: com.gobizhelp.handsfreeos
name: Calendar - your day and week, an appointment, and confirming a customer with no signal
tags:
  - ci
# The day as a list with the week over it, Everyone and Just me, then one appointment's own screen. Marking a customer
# confirmed reaches nobody, so it works with no signal: it shows the moment it is pressed and goes once by itself.
env:
  EMAIL: dale@lonestarhvac.test
  PASSWORD: HandsFree-Demo-2026
---
- runFlow: subflows/start-signed-out.yaml
- runFlow: subflows/sign-in-with-password.yaml
- runFlow: subflows/open-test-changes.yaml
- runFlow: subflows/nothing-waiting.yaml
- runFlow: subflows/open-calendar.yaml
- assertVisible:
    id: 'calendar-zone'
- assertVisible:
    id: 'calendar-day-heading'
    text: 'Today · .*'
- takeScreenshot: calendar-day
# Just me is one person's day, and Everyone is the business's.
- tapOn:
    id: 'calendar-just-me'
- waitForAnimationToEnd
- takeScreenshot: calendar-just-me
- tapOn:
    id: 'calendar-everyone'
- waitForAnimationToEnd
# The first copy is still filling right after a first sign-in, so give the day a moment before walking the week.
- extendedWaitUntil:
    visible:
      id: 'agenda'
    timeout: 60000
    optional: true
# Walk the week to a day that has something on it, and open the first appointment.
- repeat:
    times: 7
    while:
      notVisible:
        id: 'agenda'
    commands:
      - tapOn:
          point: '75%,22%'
      - waitForAnimationToEnd
- assertVisible:
    id: 'agenda'
- tapOn:
    id: 'agenda-appt-.*'
- extendedWaitUntil:
    visible:
      id: 'appointment-status'
    timeout: 20000
- takeScreenshot: calendar-appointment
- runFlow: subflows/open-test-changes.yaml
- runFlow: subflows/no-signal.yaml
# Confirming a customer reaches nobody, so it works with no signal. The first visit of the day may already be
# confirmed; `calendar-confirm.yaml` is the run that proves one by its receipt, on a visit named by its own link.
- runFlow: subflows/open-calendar.yaml
- tapOn:
    id: 'agenda-appt-.*'
- extendedWaitUntil:
    visible:
      id: 'appointment-status'
    timeout: 20000
- runFlow:
    when:
      visible:
        id: 'mark-confirmed-.*'
    commands:
      - tapOn:
          id: 'mark-confirmed-.*'
      - extendedWaitUntil:
          visible:
            id: 'appointment-confirmed'
          timeout: 15000
      - assertVisible: 'Confirmed by .*'
      - takeScreenshot: calendar-confirmed-offline
- runFlow: subflows/open-test-changes.yaml
- runFlow: subflows/signal-back.yaml
- runFlow: subflows/answer-if-asked.yaml
