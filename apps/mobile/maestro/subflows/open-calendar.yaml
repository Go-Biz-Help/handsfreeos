# Opens the Calendar tab from anywhere in a business, closing whatever was opened over the tabs first.
appId: com.gobizhelp.handsfreeos
---
- repeat:
    times: 4
    while:
      notVisible:
        id: 'tab-calendar'
    commands:
      - runFlow:
          when:
            visible:
              id: 'back'
          commands:
            - tapOn:
                id: 'back'
            - waitForAnimationToEnd
- tapOn:
    id: 'tab-calendar'
# The title, not the day's heading: the tab keeps whichever of Day, Week and Month it was left on, and only Day
# heads its list with a day.
- extendedWaitUntil:
    visible:
      id: 'calendar-title'
    timeout: 30000
