# Signal back, from Settings → Test tools: the reverse of settings-no-signal.yaml. Leaves the phone on Settings.
appId: com.gobizhelp.handsfreeos
---
- repeat:
    times: 4
    while:
      notVisible:
        id: 'tab-more'
    commands:
      - runFlow:
          when:
            visible:
              id: 'back'
          commands:
            - tapOn:
                id: 'back'
- tapOn:
    id: 'tab-more'
- tapOn:
    id: 'more-settings'
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'test-no-signal'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'test-no-signal'
- extendedWaitUntil:
    notVisible:
      id: 'status-strip'
    timeout: 30000
