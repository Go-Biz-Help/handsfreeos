# No signal, from Settings → Test tools: the app's own switch, which both phones have in a test build (the iOS
# simulator has no airplane mode). Leaves the phone on the Settings screen.
appId: com.gobizhelp.handsfreeos
---
- repeat:
    times: 4
    while:
      notVisible:
        id: 'tab-more'
    commands:
      - runFlow:
          when:
            visible:
              id: 'back'
          commands:
            - tapOn:
                id: 'back'
- tapOn:
    id: 'tab-more'
- tapOn:
    id: 'more-settings'
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'test-no-signal'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'test-no-signal'
- extendedWaitUntil:
    visible:
      id: 'status-strip-text'
      text: 'Offline.*'
    timeout: 20000
