# Opens Settings → This phone's copy (test builds) from any of a business's tabs.
appId: com.gobizhelp.handsfreeos
---
- tapOn:
    id: 'tab-more'
- tapOn:
    id: 'more-settings'
- scrollUntilVisible:
    element:
      id: 'test-phone-copy'
# Once more to the end: the iOS simulator counts a row behind the tab bar as on screen, and the tap would land on
# the tab bar.
- scroll
- tapOn:
    id: 'test-phone-copy'
- extendedWaitUntil:
    visible:
      id: 'phone-copy'
    timeout: 10000
