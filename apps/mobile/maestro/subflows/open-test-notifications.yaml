# Opens Settings → Test notifications (test builds) from any of a business's tabs, and waits for this phone's
# registration to show.
appId: com.gobizhelp.handsfreeos
---
# Back to the tabs first: a link or a notification may have opened a screen over them (step 14's conversation), and
# the tab bar is under it.
- repeat:
    times: 4
    while:
      notVisible:
        id: 'tab-more'
    commands:
      - runFlow:
          when:
            visible:
              id: 'back'
          commands:
            - tapOn:
                id: 'back'
            - waitForAnimationToEnd
- tapOn:
    id: 'tab-more'
# The More tab keeps the screen it was left on (a link or a notification may have opened another tab since): pressed
# again, it goes back to its first screen.
- runFlow:
    when:
      notVisible:
        id: 'more-settings'
    commands:
      - tapOn:
          id: 'tab-more'
- tapOn:
    id: 'more-settings'
- scrollUntilVisible:
    element:
      id: 'test-notifications'
# Once more to the end: the iOS simulator counts a row behind the tab bar as on screen, and the tap would land on
# the tab bar.
- scroll
- tapOn:
    id: 'test-notifications'
- extendedWaitUntil:
    visible:
      id: 'tn-registration'
    timeout: 15000
