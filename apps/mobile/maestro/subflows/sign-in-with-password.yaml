# Signs in from the sign-in screen with EMAIL and PASSWORD, which the calling flow sets (a subflow's own env would
# override what the caller passes).
appId: com.gobizhelp.handsfreeos
---
- tapOn:
    id: 'email'
- eraseText: 60
- inputText: ${EMAIL}
- tapOn:
    id: 'use-my-password'
- extendedWaitUntil:
    visible: 'Enter your password'
    timeout: 10000
- assertVisible: 'For ${EMAIL}'
- tapOn:
    id: 'password'
- eraseText: 40
- inputText: ${PASSWORD}
- tapOn:
    id: 'sign-in-button'
# A first sign-in on this phone waits for the business's copy to come down.
- extendedWaitUntil:
    visible:
      id: 'home'
    timeout: 60000
# The first time a business's screens show, the phone asks whether HandsFreeOS may send notifications.
- runFlow: allow-notifications.yaml
