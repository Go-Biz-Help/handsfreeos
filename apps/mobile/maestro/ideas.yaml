appId: com.gobizhelp.handsfreeos
name: Ideas - the board, a vote given and taken back, an idea, the roadmap and What's new
tags:
  - ci
# More → Ideas (0102): the board every business shares, live from HandsFreeOS. Dale finds Riley's "Recurring jobs on
# the calendar" (under review, with Riley's vote and Tom's), votes for it and takes the vote back, so the seeded board
# is as it was; opens it and sees the switch for its emails; then the roadmap's planned ideas and What's new, newest
# first.
env:
  EMAIL: dale@lonestarhvac.test
  PASSWORD: HandsFree-Demo-2026
---
- runFlow: subflows/start-signed-out.yaml
- runFlow: subflows/sign-in-with-password.yaml
- repeat:
    times: 4
    while:
      notVisible:
        id: 'tab-more'
    commands:
      - runFlow:
          when:
            visible:
              id: 'back'
          commands:
            - tapOn:
                id: 'back'
- tapOn:
    id: 'tab-more'
- extendedWaitUntil:
    visible:
      id: 'more'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'more-ideas'
    timeout: 10000
- tapOn:
    id: 'more-ideas'
- extendedWaitUntil:
    visible:
      id: 'ideas-list'
    timeout: 30000
- takeScreenshot: ideas-board
# One word finds it, so once the rest of the board has gone its vote button is the only one there.
- tapOn:
    id: 'ideas-search'
- inputText: 'recurring'
- extendedWaitUntil:
    notVisible: 'Text the customer when the tech is on the way'
    timeout: 20000
- extendedWaitUntil:
    visible: 'Recurring jobs on the calendar'
    timeout: 20000
- runFlow:
    file: subflows/keyboard-away.yaml
    env:
      FIELD: ideas-search
- assertVisible:
    id: 'idea-vote-count'
    text: '2'
- tapOn:
    id: 'idea-vote'
- extendedWaitUntil:
    visible:
      id: 'idea-vote-count'
      text: '3'
    timeout: 20000
- tapOn:
    id: 'idea-vote'
- extendedWaitUntil:
    visible:
      id: 'idea-vote-count'
      text: '2'
    timeout: 20000
# The idea itself: where it stands, and voting having followed it, the switch for its emails.
- tapOn: 'Recurring jobs on the calendar'
- extendedWaitUntil:
    visible:
      id: 'idea-title-shown'
      text: 'Recurring jobs on the calendar'
    timeout: 20000
- assertVisible: 'New, and waiting for the team to read it.'
- assertVisible:
    id: 'idea-follow'
- takeScreenshot: idea
- tapOn:
    id: 'back'
- extendedWaitUntil:
    visible:
      id: 'ideas-tab-roadmap'
    timeout: 20000
- tapOn:
    id: 'ideas-tab-roadmap'
- extendedWaitUntil:
    visible: 'Text the customer when the tech is on the way'
    timeout: 30000
- takeScreenshot: roadmap
- tapOn:
    id: 'ideas-tab-whats-new'
- extendedWaitUntil:
    visible: 'Reminders no longer go out twice after a reschedule'
    timeout: 30000
- takeScreenshot: whats-new
- tapOn:
    id: 'back'
- extendedWaitUntil:
    visible:
      id: 'more'
    timeout: 20000
