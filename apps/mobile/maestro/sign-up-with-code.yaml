appId: com.gobizhelp.handsfreeos
name: Create an account with an emailed code
# A new account made on the phone, confirmed with the code supabase/templates/confirmation.html sends, read from the
# local stack's Mailpit. With no business yet it lands on the setup's first screen, which makes the business and opens
# the rest of the setup (HANDSFREEOS_ONBOARDING_QUICK_SETUP_IMPLEMENTATION_PLAN.md §8); then it signs out for the next
# flow.
tags:
  - ci
  - code
---
- runFlow: subflows/start-signed-out.yaml
- evalScript: ${output.email = 'phone-signup-' + Date.now() + '@hfos.test'}
- scrollUntilVisible:
    element:
      id: 'create-an-account'
- tapOn:
    id: 'create-an-account'
- extendedWaitUntil:
    visible:
      id: 'sign-up'
    timeout: 10000
- assertVisible: 'Create your account'
# Too short a password is refused before anything is sent.
- tapOn:
    id: 'full-name'
- inputText: 'Priya Natarajan'
- tapOn:
    id: 'email'
- inputText: ${output.email}
# The password's return key creates the account, as Create account does.
- tapOn:
    id: 'password'
- inputText: 'too-short'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Use at least 12 characters. A short sentence works well.'
    timeout: 10000
- tapOn:
    id: 'password'
- eraseText: 20
- inputText: 'correct-horse-battery-staple'
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: 'code-screen'
    timeout: 15000
- assertVisible: 'Check your email'
- runScript:
    file: scripts/latest-code.js
    env:
      EMAIL: ${output.email}
      SUBJECT: 'Confirm your HandsFreeOS email'
- tapOn:
    id: 'code-input'
- inputText: ${output.code}
# Signed in, and in no business yet: the setup's first screen, where the business is made.
- extendedWaitUntil:
    visible:
      id: 'onboarding-setup-step-business'
    timeout: 30000
- assertVisible:
    id: 'choose-business-sign-out'
- tapOn:
    id: 'setup-business-name'
- inputText: 'Natarajan Plumbing'
- runFlow:
    file: subflows/keyboard-away.yaml
    env:
      FIELD: setup-business-name
# What they do: a big button opens the kinds in it.
- tapOn:
    id: 'setup-kind-button-home'
- scrollUntilVisible:
    element:
      id: 'setup-kind-plumbing'
    centerElement: true
- tapOn:
    id: 'setup-kind-plumbing'
# The address. Its state is picked on a sheet, and sets the time zone.
- scrollUntilVisible:
    element:
      id: 'setup-line1'
    centerElement: true
- tapOn:
    id: 'setup-line1'
- inputText: '12 Oak St'
- runFlow:
    file: subflows/keyboard-away.yaml
    env:
      FIELD: setup-line1
- scrollUntilVisible:
    element:
      id: 'setup-city'
    centerElement: true
- tapOn:
    id: 'setup-city'
- inputText: 'Austin'
- runFlow:
    file: subflows/keyboard-away.yaml
    env:
      FIELD: setup-city
- scrollUntilVisible:
    element:
      id: 'setup-state'
    centerElement: true
- tapOn:
    id: 'setup-state'
- extendedWaitUntil:
    visible:
      id: 'setup-state-sheet'
    timeout: 10000
- tapOn:
    id: 'setup-state-search'
- inputText: 'Texas'
- tapOn:
    id: 'setup-state-TX'
- scrollUntilVisible:
    element:
      id: 'setup-postal-code'
    centerElement: true
- tapOn:
    id: 'setup-postal-code'
- inputText: '78701'
- runFlow:
    file: subflows/keyboard-away.yaml
    env:
      FIELD: setup-postal-code
# No website: the next screens ask instead.
- scrollUntilVisible:
    element:
      id: 'ai-setup-no-website'
    centerElement: true
- tapOn:
    id: 'ai-setup-no-website'
- tapOn:
    id: 'onboarding-setup-next'
# Made, and the rest of the setup opens on the business's own screen, at the goal.
- extendedWaitUntil:
    visible:
      id: 'onboarding-setup-step-goal'
    timeout: 30000
# Signed out for the next flow, from the new business's Home once its copy is on the phone.
- runFlow: subflows/start-signed-out.yaml
