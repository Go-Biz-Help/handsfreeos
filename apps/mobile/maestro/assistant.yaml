appId: com.gobizhelp.handsfreeos
name: Ask HandsFreeOS - an answer with its card, and your chats
tags:
  - ci
# The mark at the top of every screen opens Ask HandsFreeOS full screen. The first time it asks for the OK to send
# what you ask about to Anthropic’s Claude (the OK is kept with the account, so later runs go straight in). Then a
# question with a card: every figure on it comes from Money, not from the model. Finally the chats list, which is
# where the answer was saved, and a new chat.
env:
  EMAIL: dale@lonestarhvac.test
  PASSWORD: HandsFree-Demo-2026
---
- runFlow: subflows/start-signed-out.yaml
- runFlow: subflows/sign-in-with-password.yaml
- extendedWaitUntil:
    visible:
      id: 'ask-handsfreeos'
    timeout: 30000
- tapOn:
    id: 'ask-handsfreeos'
- extendedWaitUntil:
    visible:
      id: 'ask'
    timeout: 20000
# The consent step shows until this person has said OK; the OK is kept with the account, so it shows once.
- runFlow: subflows/assistant-consent.yaml
- assertVisible:
    id: 'assistant-input'
- tapOn:
    id: 'assistant-input'
- inputText: 'What are we owed?'
- tapOn:
    id: 'assistant-send'
# The question stays in the chat while the answer streams in.
- assertVisible: 'What are we owed?'
- extendedWaitUntil:
    visible:
      id: 'assistant-card-money'
    timeout: 60000
- assertVisible:
    id: 'assistant-answer-text'
- takeScreenshot: assistant-answer
# Your chats: the one just asked is saved there, and it opens again.
- tapOn:
    id: 'assistant-history-toggle'
- extendedWaitUntil:
    visible:
      id: 'assistant-thread'
    timeout: 30000
- takeScreenshot: assistant-chats
- tapOn:
    id: 'assistant-thread'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'assistant-card-money'
    timeout: 30000
# A new chat starts empty, and the Assistant says what it's for.
- tapOn:
    id: 'assistant-new-chat'
- extendedWaitUntil:
    visible:
      id: 'assistant-empty'
    timeout: 20000
- tapOn:
    id: 'close'
- extendedWaitUntil:
    visible:
      id: 'tab-home'
    timeout: 20000
