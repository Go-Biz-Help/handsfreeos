# Maestro flows for the phone app. CI runs the tagged `ci` flows on an Android emulator (.github/workflows/mobile-e2e.yml);
# locally: `maestro test apps/mobile/maestro` with a test build (EXPO_PUBLIC_E2E=1) on a simulator or emulator.
# Seed accounts come from apps/worker/scripts/seed.ts (pnpm db:seed).
flows:
  - '*.yaml'
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - Sign in with a password
    - Sign in with an emailed code
    - Home and the five tabs
    - Switch business and keep businesses on the phone
    - Lock with Face ID and unlock
    - No signal, with the access token run out
    - The phone's copy, with no signal
    - Signing in as someone else deletes the last person's copy
    - Changes made with no signal go once signal is back
    - A text written 45 minutes ago asks Still send?
    - A refused customer holds their lead while other changes go
    - A photo taken with no signal uploads when signal is back, and a closed app resumes its upload
    - The self-test passes on this phone
    - The notification switches save through HandsFreeOS
    - Links open the app's screens, and never a customer's page
    - A customer's text arrives as a notification, and Reply from the shade sends once
    - Inbox - a reply with a photo written with no signal goes once, when signal is back
    - Inbox - a text inside quiet hours asks, waits for the morning with Cancel, and Cancel takes it back
    - Inbox - take a conversation over from the AI teammate, and hand it back
    - Inbox - a close made with no signal doesn't stand when the customer wrote again
    - Calls - verify my cell, call a customer through it, and cancel while it rings
    - Home ranks what needs attention, with its sheets and Approvals
    - A snooze and a dismissal made with no signal leave Home at once and go once signal is back
