appId: com.gobizhelp.handsfreeos
name: Home and the five tabs
tags:
  - ci
# Seed accounts (apps/worker/scripts/seed.ts); the password is the seed's, for local stacks only.
env:
  EMAIL: dale@lonestarhvac.test
  PASSWORD: HandsFree-Demo-2026
---
- runFlow: subflows/start-signed-out.yaml
- runFlow: subflows/sign-in-with-password.yaml
# Home: the Action Center's band (the greeting, "Up to date"), the business's mark, Ask HandsFreeOS at the top right.
- assertVisible:
    id: 'attention-header'
- assertVisible: 'Up to date'
- assertVisible:
    id: 'ask-handsfreeos'
- assertVisible:
    id: 'business-mark'
- tapOn:
    id: 'tab-inbox'
- extendedWaitUntil:
    visible:
      id: 'inbox-search'
    timeout: 20000
- tapOn:
    id: 'tab-pipeline'
# The Pipeline tab is the board one stage at a time now (step 15), not a placeholder.
- extendedWaitUntil:
    visible:
      id: 'pipeline-summary'
    timeout: 20000
- tapOn:
    id: 'tab-calendar'
# The Calendar tab is the day and its week now (step 16), not a placeholder.
- extendedWaitUntil:
    visible:
      id: 'calendar-day-heading'
    timeout: 20000
- tapOn:
    id: 'tab-more'
- assertVisible: 'Customers'
# The last row: on a short screen it is under the tab bar until More scrolls.
- scrollUntilVisible:
    element:
      id: 'more-open-on-web'
    timeout: 10000
- assertVisible:
    id: 'more-open-on-web'
- tapOn:
    id: 'more-customers'
# Customers is the list and its search now (step 15), not a placeholder.
- extendedWaitUntil:
    visible:
      id: 'customers-search'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'back'
- tapOn:
    id: 'more-settings'
- assertVisible:
    id: 'setting-businesses'
- assertVisible:
    id: 'setting-sign-out'
# Ask HandsFreeOS is one tap away from every screen (its own flows ask it something; here it only opens).
- tapOn:
    id: 'ask-handsfreeos'
- extendedWaitUntil:
    visible:
      id: 'ask'
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: 'close'
- tapOn:
    id: 'tab-home'
- assertVisible:
    id: 'home'
