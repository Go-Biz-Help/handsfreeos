appId: com.gobizhelp.handsfreeos
name: Tasks - the web's groups and due words, and completing one
tags:
  - ci
# More → Tasks: Mine and Everyone with their counts, the line that says where due dates are read, the web's own groups
# (Overdue in red, Today in the accent), and the circle that completes a task. The flow reopens what it completed.
env:
  EMAIL: dale@lonestarhvac.test
  PASSWORD: HandsFree-Demo-2026
---
- runFlow: subflows/start-signed-out.yaml
- runFlow: subflows/sign-in-with-password.yaml
- repeat:
    times: 4
    while:
      notVisible:
        id: 'tab-more'
    commands:
      - runFlow:
          when:
            visible:
              id: 'back'
          commands:
            - tapOn:
                id: 'back'
- tapOn:
    id: 'tab-more'
- tapOn:
    id: 'more-tasks'
- extendedWaitUntil:
    visible:
      id: 'tasks-summary'
      text: '\d+ open · due dates in .*'
    timeout: 30000
- tapOn:
    id: 'tasks-everyone'
- extendedWaitUntil:
    visible:
      id: 'task-title'
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: 'task-due'
    timeout: 30000
- takeScreenshot: tasks-list
# The circle completes the first task and fills in at once; then it goes back.
- tapOn:
    id: 'task-toggle'
    index: 0
- extendedWaitUntil:
    visible: 'Task completed.'
    timeout: 20000
- takeScreenshot: tasks-completed
- tapOn:
    id: 'tasks-mine'
- tapOn:
    id: 'tasks-everyone'
# Done lately sits under every open group, and the list is virtualized: scroll to it.
- scrollUntilVisible:
    element:
      id: 'tasks-group-done'
    timeout: 30000
    centerElement: true
